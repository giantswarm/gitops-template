# Values of Giant Swarm's flux-operator chart in the kind test. A management
# cluster gets the CRDs from management-cluster-bases and turns them off in the
# chart; the kind cluster has no other source, so the chart installs them. The
# VerticalPodAutoscaler and the ServiceMonitor need CRDs the kind cluster doesn't
# have. NOTIFICATIONS_DISABLED is set as on the management clusters. Everything
# else is the chart's default, including the requests of 100m CPU and 64Mi.
giantswarm:
  verticalPodAutoscaler:
    enabled: false
flux-operator:
  installCRDs: true
  serviceMonitor:
    create: false
  extraEnvs:
    - name: NOTIFICATIONS_DISABLED
      value: "1"
