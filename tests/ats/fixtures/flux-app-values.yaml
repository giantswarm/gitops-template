# Values of Giant Swarm's flux-app chart in the kind test. They only turn off the
# objects whose CRDs a management cluster has and the kind cluster doesn't:
# Prometheus' PodMonitors, and the kube-state-metrics the chart bundles, which
# brings a ServiceMonitor and a CiliumNetworkPolicy that its values can't turn off.
# Everything else is the chart's default.
podMonitors:
  enabled: false
kubeStateMetrics:
  enabled: false
