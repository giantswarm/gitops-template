# Values of Giant Swarm's kyverno chart in the kind test. They only turn off the
# objects whose CRDs a management cluster has and the kind cluster doesn't:
# Cilium's CiliumNetworkPolicy, Grafana's PodLogs, the VerticalPodAutoscaler and
# Prometheus' ServiceMonitor. The controllers request less CPU than the chart's, and the
# background and reports controllers less memory than its 1Gi, which are sized for a
# management cluster: the kind cluster is one node on a CI runner, and the apps of the
# workload cluster's vCluster have to fit next to them, see tests/ats/node_room.py. Requests
# only decide where pods fit; Kyverno can still use up to its limits. Everything else is the
# chart's default.
ciliumNetworkPolicy:
  enabled: false
monitoring:
  podLogs:
    enabled: false
verticalPodAutoscaler:
  admissionController:
    enabled: false
  backgroundController:
    enabled: false
  cleanupController:
    enabled: false
  reportsController:
    enabled: false
  kyvernoPlugin:
    enabled: false
  policyReporter:
    enabled: false
  ui:
    enabled: false
kyverno:
  admissionController:
    container:
      resources:
        requests:
          cpu: 30m
    serviceMonitor:
      enabled: false
  backgroundController:
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
    serviceMonitor:
      enabled: false
  cleanupController:
    resources:
      requests:
        cpu: 10m
    serviceMonitor:
      enabled: false
  reportsController:
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
    serviceMonitor:
      enabled: false
policy-reporter:
  monitoring:
    enabled: false
