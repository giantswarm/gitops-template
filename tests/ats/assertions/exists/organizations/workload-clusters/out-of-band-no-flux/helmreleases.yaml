apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    giantswarm.io/cluster: out-of-band-no-flux
    giantswarm.io/managed-by: flux
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-out-of-band-no-flux
    kustomize.toolkit.fluxcd.io/namespace: default
  name: out-of-band-no-flux
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: out-of-band-no-flux
    namespace: org-org-name
  install:
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m0s
  releaseName: out-of-band-no-flux
  serviceAccountName: automation
  storageNamespace: org-org-name
  targetNamespace: org-org-name
  timeout: 10m0s
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: cluster-app-installation-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: out-of-band-no-flux-config
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-no-flux-region-config
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-no-flux-cluster-userconfig
      valuesKey: values
