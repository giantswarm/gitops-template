---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: out-of-band-no-flux
    giantswarm.io/managed-by: flux
    gitops.giantswarm.io/appSet: hello-web-app
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-out-of-band-no-flux
    kustomize.toolkit.fluxcd.io/namespace: default
  name: out-of-band-no-flux-hello-world
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: out-of-band-no-flux-hello-world
    namespace: org-org-name
  dependsOn:
    - name: out-of-band-no-flux-gateway-api-crds
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  kubeConfig:
    secretRef:
      name: out-of-band-no-flux-kubeconfig
  releaseName: hello-world
  storageNamespace: hello-world
  targetNamespace: hello-world
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: out-of-band-no-flux-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-no-flux-hello-world-values
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-no-flux-hello-world-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: out-of-band-no-flux-hello-world-user-secrets
      optional: true
      valuesKey: values
---
