---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: mapi-out-of-band-flux-app
    giantswarm.io/managed-by: flux
    gitops.giantswarm.io/appSet: hello-web-app
    kustomize.toolkit.fluxcd.io/name: clusters-mapi-out-of-band-flux-app
    kustomize.toolkit.fluxcd.io/namespace: default
  name: mapi-out-of-band-flux-app-hello-world
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: mapi-out-of-band-flux-app-hello-world
    namespace: org-org-name
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: -1
  interval: 5m
  kubeConfig:
    secretRef:
      name: mapi-out-of-band-flux-app-kubeconfig
  releaseName: hello-world
  storageNamespace: org-org-name
  targetNamespace: org-org-name
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: mapi-out-of-band-flux-app-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: mapi-out-of-band-flux-app-hello-world-values
      valuesKey: values
    - kind: ConfigMap
      name: mapi-out-of-band-flux-app-hello-world-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: mapi-out-of-band-flux-app-hello-world-user-secrets
      optional: true
      valuesKey: values
