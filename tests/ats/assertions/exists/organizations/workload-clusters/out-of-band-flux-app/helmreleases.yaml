apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: out-of-band-flux-app
    giantswarm.io/managed-by: flux
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-out-of-band-flux-app-apps
    kustomize.toolkit.fluxcd.io/namespace: org-org-name
  name: out-of-band-flux-app-flux
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: out-of-band-flux-app-flux
    namespace: org-org-name
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  kubeConfig:
    secretRef:
      name: out-of-band-flux-app-kubeconfig
  releaseName: flux
  storageNamespace: flux-app
  targetNamespace: flux-app
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: out-of-band-flux-app-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-flux-app-flux-app-user-values
