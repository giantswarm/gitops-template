      valuesKey: values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    giantswarm.io/cluster: out-of-band-flux-app
    giantswarm.io/managed-by: flux
    giantswarm.io/prevent-deletion: "true"
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-out-of-band-flux-app
    kustomize.toolkit.fluxcd.io/namespace: org-org-name
  name: out-of-band-flux-app
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: out-of-band-flux-app
    namespace: org-org-name
  install:
    remediation:
      remediateLastFailure: false
  interval: 5m0s
  releaseName: out-of-band-flux-app
  serviceAccountName: automation
  storageNamespace: org-org-name
  targetNamespace: org-org-name
  timeout: 10m0s
  upgrade:
    remediation:
      remediateLastFailure: false
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: cluster-app-installation-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: out-of-band-flux-app-config
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-flux-app-region-config
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-flux-app-cluster-userconfig
      valuesKey: values
