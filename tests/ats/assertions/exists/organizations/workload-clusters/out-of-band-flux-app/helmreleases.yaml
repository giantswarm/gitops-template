---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: out-of-band-flux-app
    giantswarm.io/managed-by: flux
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-out-of-band-flux-app-apps
    kustomize.toolkit.fluxcd.io/namespace: org-org-name
  name: out-of-band-flux-app-hello-world
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: out-of-band-flux-app-hello-world
    namespace: org-org-name
  dependsOn:
    - name: out-of-band-flux-app-gateway-api-crds
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  kubeConfig:
    secretRef:
      name: out-of-band-flux-app-kubeconfig
  releaseName: hello-world
  storageNamespace: hello-world
  targetNamespace: hello-world
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: out-of-band-flux-app-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-flux-app-hello-world-values
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-flux-app-hello-world-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: out-of-band-flux-app-hello-world-user-secrets
      optional: true
      valuesKey: values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: out-of-band-flux-app
    giantswarm.io/managed-by: flux
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-out-of-band-flux-app-apps
    kustomize.toolkit.fluxcd.io/namespace: org-org-name
  name: out-of-band-flux-app-hello-world-standalone
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: out-of-band-flux-app-hello-world-standalone
    namespace: org-org-name
  dependsOn:
    - name: out-of-band-flux-app-gateway-api-crds
  install:
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  kubeConfig:
    secretRef:
      name: out-of-band-flux-app-kubeconfig
  releaseName: hello-world-standalone
  storageNamespace: hello-world
  targetNamespace: hello-world
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  values:
    ingress:
      enabled: false
    route:
      enabled: true
      parentRefs:
        - name: giantswarm-default
          namespace: envoy-gateway-system
      hostnames:
        - "hello-standalone.{{ .Values.baseDomain }}"
  valuesFrom:
    - kind: ConfigMap
      name: out-of-band-flux-app-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: out-of-band-flux-app-hello-world-standalone-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: out-of-band-flux-app-hello-world-standalone-user-secrets
      optional: true
      valuesKey: values
---
