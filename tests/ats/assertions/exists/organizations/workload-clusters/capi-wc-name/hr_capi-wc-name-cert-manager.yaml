apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: capi-wc-name
    giantswarm.io/managed-by: flux
    kustomize.toolkit.fluxcd.io/name: clusters-capi-wc-name
    kustomize.toolkit.fluxcd.io/namespace: default
  name: capi-wc-name-cert-manager
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: capi-wc-name-cert-manager
  install:
    createNamespace: true
  interval: 10m
  kubeConfig:
    secretRef:
      name: capi-wc-name-kubeconfig
  releaseName: capi-wc-name-cert-manager
  storageNamespace: org-org-name
  targetNamespace: org-org-name
