---
# Decrypted by Flux with the age key from the SOPS-encrypted secret.enc.yaml of cert-manager.
# kustomize-controller applies nothing from a Kustomization with a file it can't decrypt, so
# the Secret only exists if the age key worked. Its value isn't asserted, so no Secret value is
# committed here.
apiVersion: v1
kind: Secret
metadata:
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: capi-wc-name-cert-manager-standalone-user-secrets
  namespace: org-org-name
