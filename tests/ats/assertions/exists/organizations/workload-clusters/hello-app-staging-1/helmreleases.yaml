    namespace: org-org-name
  install:
    remediation:
      remediateLastFailure: false
      retries: -1
  kubeConfig:
    secretRef:
      name: hello-app-staging-1-kubeconfig
  releaseName: gateway-api-crds
  storageNamespace: kube-system
  targetNamespace: kube-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: hello-app-staging-1-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: hello-app-staging-1-gateway-api-crds-values
      valuesKey: values
    - kind: ConfigMap
      name: hello-app-staging-1-gateway-api-crds-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: hello-app-staging-1-gateway-api-crds-user-secrets
      optional: true
      valuesKey: values
