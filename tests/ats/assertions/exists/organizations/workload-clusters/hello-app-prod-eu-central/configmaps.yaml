---
apiVersion: v1
data:
  values: |
    global:
      connectivity:
        network: {}
        topology: {}
      controlPlane: {}
      metadata:
        description: description
        name: hello-app-prod-eu-central
        organization: org-name
        preventDeletion: false
      providerSpecific: {}
kind: ConfigMap
metadata:
  name: hello-app-prod-eu-central-config
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    global:
      providerSpecific:
        region: eu-central-1
kind: ConfigMap
metadata:
  name: hello-app-prod-eu-central-region-config
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    global:
      nodePools:
        large:
          availabilityZones:
            - eu-central-1a
            - eu-central-1b
            - eu-central-1c
          instanceType: m6a.2xlarge
          maxSize: 10
          minSize: 1
kind: ConfigMap
metadata:
  name: hello-app-prod-eu-central-region-node-pool-config
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    autoscaling:
      minReplicas: 3
    ingress:
      enabled: false
    route:
      enabled: true
      kind: HTTPRoute
      parentRefs: # has to be in sync with the Gateway served by the cluster's Envoy Gateway
        - name: giantswarm-default
          namespace: envoy-gateway-system
      hostnames: # under the cluster's base domain and in the Gateway's `listeners.https.subdomains`
        - "hello.{{ .Values.baseDomain }}"
kind: ConfigMap
metadata:
  name: hello-app-prod-eu-central-hello-world-values
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    global:
      nodePools:
        nodepool0:
          instanceType: m6a.8xlarge
          maxSize: 50
          minSize: 10
kind: ConfigMap
metadata:
  name: hello-app-prod-eu-central-cluster-userconfig
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    gateways:
      default:
        listeners:
          https:
            # DNS record and certificate entry for the hello-world app's hostname,
            # `hello.<cluster base domain>`
            subdomains:
              - hello
kind: ConfigMap
metadata:
  name: hello-app-prod-eu-central-gateway-api-config-user-values
  namespace: org-org-name
