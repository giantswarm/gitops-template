---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    gitops.giantswarm.io/appSet: hello-web-app
    kustomize.toolkit.fluxcd.io/name: hello-app-prod-eu-central
    kustomize.toolkit.fluxcd.io/namespace: default
  name: hello-app-prod-eu-central-hello-world
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: hello-app-prod-eu-central-hello-world
  install:
    createNamespace: true
  interval: 10m
  kubeConfig:
    secretRef:
      name: hello-app-prod-eu-central-kubeconfig
  releaseName: hello-app-prod-eu-central-hello-world
  storageNamespace: org-org-name
  targetNamespace: org-org-name
  valuesFrom:
    - kind: ConfigMap
      name: hello-app-prod-eu-central-hello-world-values
      valuesKey: values
