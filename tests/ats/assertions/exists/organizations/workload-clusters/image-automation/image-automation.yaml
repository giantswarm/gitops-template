# The image automation of the cluster, applied by the cluster's Kustomization. The kind test patches
# the ImageUpdateAutomation's push branch and checkout, see docs/reference/ci-checks.md, "Image
# automation", so neither is asserted here.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  labels:
    giantswarm.io/cluster: image-automation
    giantswarm.io/managed-by: flux
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-image-automation
    kustomize.toolkit.fluxcd.io/namespace: org-org-name
  name: image-automation-image-updates
  namespace: org-org-name
spec:
  secretRef:
    name: image-automation-image-updates-deploy-key
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  labels:
    giantswarm.io/cluster: image-automation
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-image-automation
  name: image-automation-helloworld
  namespace: org-org-name
spec:
  image: gsoci.azurecr.io/giantswarm/helloworld
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  labels:
    giantswarm.io/cluster: image-automation
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-image-automation
  name: image-automation-helloworld
  namespace: org-org-name
spec:
  imageRepositoryRef:
    name: image-automation-helloworld
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  labels:
    giantswarm.io/cluster: image-automation
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-image-automation
  name: image-automation
  namespace: org-org-name
spec:
  policySelector:
    matchLabels:
      giantswarm.io/cluster: image-automation
  sourceRef:
    kind: GitRepository
    name: image-automation-image-updates
  update:
    path: ./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/WC_NAME_IMAGE_AUTOMATION/out-of-band
    strategy: Setters
---
# Written by External Secrets Operator from the deploy key in the stand-in store, which the test
# decrypts from tests/ats/fixtures/image-updates
apiVersion: v1
kind: Secret
metadata:
  name: image-automation-image-updates-deploy-key
  namespace: org-org-name
