apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    giantswarm.io/cluster: image-automation
    giantswarm.io/managed-by: flux
    giantswarm.io/prevent-deletion: "true"
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-image-automation
    kustomize.toolkit.fluxcd.io/namespace: org-org-name
  name: image-automation
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: image-automation
    namespace: org-org-name
  install:
    remediation:
      remediateLastFailure: false
  interval: 5m0s
  releaseName: image-automation
  serviceAccountName: automation
  storageNamespace: org-org-name
  targetNamespace: org-org-name
  timeout: 10m0s
  upgrade:
    remediation:
      remediateLastFailure: false
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: cluster-app-installation-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: image-automation-config
      valuesKey: values
    - kind: ConfigMap
      name: image-automation-region-config
      valuesKey: values
    - kind: ConfigMap
      name: image-automation-cluster-userconfig
      valuesKey: values
