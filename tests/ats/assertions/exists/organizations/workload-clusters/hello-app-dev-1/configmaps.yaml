---
apiVersion: v1
data:
  values: |
    global:
      connectivity:
        network: {}
        topology: {}
      controlPlane: {}
      metadata:
        description: description
        name: hello-app-dev-1
        organization: org-name
        preventDeletion: true
      providerSpecific: {}
kind: ConfigMap
metadata:
  name: hello-app-dev-1-config
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    global:
      providerSpecific:
        region: eu-central-1
kind: ConfigMap
metadata:
  name: hello-app-dev-1-region-config
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    # replaces the hello-world App Template's default_config.yaml
    autoscaling:
      minReplicas: 2
    ingress:
      enabled: false
    route:
      enabled: true
      kind: HTTPRoute
      # the Gateway gateway_api_config.yaml configures
      parentRefs:
        - name: giantswarm-default
          namespace: envoy-gateway-system
      # under the cluster's base domain and in gateway_api_config.yaml's
      # `listeners.https.subdomains`
      hostnames:
        - "hello.{{ .Values.baseDomain }}"
kind: ConfigMap
metadata:
  name: hello-app-dev-1-hello-world-values
  namespace: org-org-name
---
apiVersion: v1
data:
  values: ""
kind: ConfigMap
metadata:
  name: hello-app-dev-1-cluster-userconfig
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    # replaces the envoy-gateway stack's default_config_gateway_api_config.yaml
    gateways:
      default:
        # hello_world.yaml's `route.parentRefs` attaches hello-world's HTTPRoute to
        # this Gateway
        name: giantswarm-default
        listeners:
          https:
            # DNS record and certificate entry for hello_world.yaml's
            # `route.hostnames`, `hello.<cluster base domain>`
            subdomains:
              - hello
kind: ConfigMap
metadata:
  name: hello-app-dev-1-gateway-api-config-values
  namespace: org-org-name
