---
apiVersion: v1
data:
  values: |
    global:
      metadata:
        description: description
        name: hello-app-dev-1
        organization: org-name
kind: ConfigMap
metadata:
  name: hello-app-dev-1-config
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    replicaCount: 3
    ingress:
      enabled: false
    route:
      enabled: true
      kind: HTTPRoute
      parentRefs: # has to be in sync with the Gateway served by the cluster's Envoy Gateway
        - name: giantswarm-default
          namespace: envoy-gateway-system
      hostnames: # under the cluster's base domain and in the Gateway's `listeners.https.subdomains`
        - "hello.{{ .Values.baseDomain }}"
kind: ConfigMap
metadata:
  name: hello-app-dev-1-hello-world-values
  namespace: org-org-name
---
apiVersion: v1
data:
  values: ""
kind: ConfigMap
metadata:
  name: hello-app-dev-1-user-config
  namespace: org-org-name
---
apiVersion: v1
data:
  values: |
    gateways:
      default:
        listeners:
          https:
            # DNS record and certificate entry for the hello-world app's hostname,
            # `hello.<cluster base domain>`
            subdomains:
              - hello
kind: ConfigMap
metadata:
  name: hello-app-dev-1-gateway-api-config-user-values
  namespace: org-org-name
