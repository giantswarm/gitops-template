---
apiVersion: application.giantswarm.io/v1alpha1
kind: App
metadata:
  labels:
    app-operator.giantswarm.io/version: 0.0.0
    giantswarm.io/managed-by: flux
    kustomize.toolkit.fluxcd.io/name: clusters-hello-app-dev-1
    kustomize.toolkit.fluxcd.io/namespace: default
  name: hello-app-dev-1
  namespace: org-org-name
spec:
  catalog: cluster
  config:
    configMap:
      name: hello-app-dev-1-config
      namespace: org-org-name
  extraConfigs: []
  kubeConfig:
    inCluster: true
  name: cluster-aws
  namespace: org-org-name
  userConfig:
    configMap:
      name: hello-app-dev-1-user-config
      namespace: org-org-name
  version: ""
---
apiVersion: application.giantswarm.io/v1alpha1
kind: App
metadata:
  labels:
    gitops.giantswarm.io/appSet: hello-web-app
    kustomize.toolkit.fluxcd.io/name: clusters-hello-app-dev-1
    kustomize.toolkit.fluxcd.io/namespace: default
  name: hello-app-dev-1-hello-world
  namespace: org-org-name
spec:
  catalog: giantswarm
  extraConfigs:
    - kind: configMap
      name: hello-app-dev-1-hello-world-values
      namespace: org-org-name
      priority: 1
  kubeConfig:
    inCluster: false
  name: hello-world
  namespace: org-org-name
  version: '3.2.2' # {"$imagepolicy": "org-org-name:hello-app-dev-1-hello-app"}
