---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: hello-app-prod-us-west
    giantswarm.io/managed-by: flux
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-hello-app-prod-us-west
    kustomize.toolkit.fluxcd.io/namespace: default
  name: hello-app-prod-us-west-gateway-api-crds
  namespace: org-org-name
spec:
  chartRef:
    kind: OCIRepository
    name: hello-app-prod-us-west-gateway-api-crds
    namespace: org-org-name
  install:
    remediation:
      remediateLastFailure: false
      retries: -1
  kubeConfig:
    secretRef:
      name: hello-app-prod-us-west-kubeconfig
  releaseName: gateway-api-crds
  storageNamespace: kube-system
  targetNamespace: kube-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: hello-app-prod-us-west-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: hello-app-prod-us-west-gateway-api-crds-values
      valuesKey: values
    - kind: ConfigMap
      name: hello-app-prod-us-west-gateway-api-crds-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: hello-app-prod-us-west-gateway-api-crds-user-secrets
      optional: true
      valuesKey: values
