# Pushed into the workload cluster by the PushSecrets of apps/workload-cluster-secrets, through
# the out-of-band-no-flux-kubeconfig Secret.
---
# the common token, read from the fake ClusterSecretStore the test creates; test_secrets_pushed
# checks its value
apiVersion: v1
kind: Secret
metadata:
  name: common-secret
  namespace: default
---
# the password the Password generator made for this cluster; its value differs each run, so
# test_secrets_pushed checks only that it has one
apiVersion: v1
kind: Secret
metadata:
  name: generated-password
  namespace: default
