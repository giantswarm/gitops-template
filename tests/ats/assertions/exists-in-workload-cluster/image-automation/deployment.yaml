# applied to the workload cluster by WC_NAME_IMAGE_AUTOMATION-direct.yaml, through the
# image-automation-kubeconfig Secret, which has the vCluster's kubeconfig. The test checks that it's
# available, too. Its image stays at the tag in Git: the image automation pushes its update to a
# branch, and Flux applies it only once it's merged.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: helloworld
    kustomize.toolkit.fluxcd.io/name: mc-name-clusters-image-automation-direct
    kustomize.toolkit.fluxcd.io/namespace: org-org-name
  name: helloworld
  namespace: default
spec:
  replicas: 1
