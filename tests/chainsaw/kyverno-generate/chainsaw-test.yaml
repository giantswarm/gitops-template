apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-generate
spec:
  description: >-
    The Kyverno policy of the shared-objects example is Ready and has copied its ConfigMap, with
    the source's data, into the organisation's namespace. The test only reads: the kind test's
    check_shared_object_copied creates a new organisation namespace and changes the source.
  timeouts:
    assert: 2m
  steps:
    - name: the policy is ready
      try:
        - assert:
            resource:
              apiVersion: kyverno.io/v1
              kind: ClusterPolicy
              metadata:
                name: ($values.sharedObject.policy)
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
    - name: the organisation has a copy of the source
      bindings:
        - name: source
          value: (x_k8s_get($client, 'v1', 'ConfigMap', $values.sharedObject.namespace, $values.sharedObject.configMap))
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ($values.sharedObject.configMap)
                namespace: ($values.organizationNamespace)
                labels:
                  app.kubernetes.io/managed-by: kyverno
                  generate.kyverno.io/policy-name: ($values.sharedObject.policy)
              (data == $source.data): true
