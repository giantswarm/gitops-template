# Optional, with receiver.yaml. External Secrets Operator writes the secret GitHub signs its
# webhook calls with from your secret manager. Use the same value in the webhook's settings on
# GitHub. With SOPS, commit an encrypted Secret of the same name instead, see
# docs/guides/commit-statuses.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-token
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitops-test
  target:
    name: github-webhook-token
  data:
    - secretKey: token
      remoteRef:
        key: gitops/github-webhook-token
