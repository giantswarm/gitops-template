# Posts a commit status to the repository on GitHub for every event the Alert forwards. The
# status names the Kustomization, so each one shows as its own check on the commit.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-commit-status
  namespace: default
spec:
  type: github
  address: https://github.com/YOUR_ORG/YOUR_REPO  # TODO: change to the repository the GitRepository reads
  secretRef:
    name: github-commit-status-token
