# Forwards the events of the Kustomizations of this repository in `default` to the Provider:
# the management cluster's in MC_NAME.yaml and each organisation's in namespace.yaml. The workload
# clusters' are in their organisation's namespace. An event source without
# `namespace` matches only the Alert's own namespace, so the Alert never sees Giant Swarm's own
# Kustomizations in `flux-giantswarm`. Each organisation has its own Alert for the
# Kustomizations in its namespace, in organizations/ORG_NAME/namespace/notifications.
# `info` forwards successes as well as failures, so a commit shows when Flux applied it. If
# Kustomizations of another repository live in this namespace, list this repository's by name.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-commit-status
  namespace: default
spec:
  providerRef:
    name: github-commit-status
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
