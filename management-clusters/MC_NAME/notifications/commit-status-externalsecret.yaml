# External Secrets Operator writes the GitHub token of the Provider from your secret manager.
# The token needs read and write access to the repository's commit statuses. The store is the
# one in docs/appendices.md, "Secret store for testing": point `secretStoreRef` at your own store.
# With SOPS, commit an encrypted Secret of the same name instead, see docs/guides/commit-statuses.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-commit-status-token
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gitops-test
  target:
    name: github-commit-status-token
  data:
    - secretKey: token
      remoteRef:
        key: gitops/github-commit-status-token
