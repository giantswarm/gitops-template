# Optional. Flux fetches the repository when GitHub calls the webhook on a push, instead of
# waiting for the GitRepository's interval. GitHub has to reach the `webhook-receiver` Service
# of notification-controller, see docs/guides/commit-statuses.md.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-push
  namespace: default
spec:
  type: github
  events:
    - ping
    - push
  secretRef:
    name: github-webhook-token
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: your-repo  # TODO: change "your-repo" to the name of GitRepository pointing to your GitOps repo
