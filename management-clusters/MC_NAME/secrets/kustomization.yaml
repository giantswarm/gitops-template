apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
kind: Kustomization
# Flux decrypts with these keys: deleting one stops GitOps for its clusters
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
labels:
  - pairs:
      giantswarm.io/managed-by: flux
      # nobody can delete them, Flux included, until this label is removed
      giantswarm.io/prevent-deletion: "true"
resources:
  - MC_NAME.gpgkey.enc.yaml
  - WC_NAME.gpgkey.enc.yaml
  - FROM_TEMPLATE_WC_NAME.gpgkey.enc.yaml
  - WC_NAME.agekey.enc.yaml
# A Kustomization reads its decryption Secret from its own namespace, so a workload
# cluster's key goes into the namespace of the cluster's organization. The example keys
# were encrypted in `default`, and SOPS's checksum covers the namespace, so this patch
# moves them; create a new key's Secret in its organization's namespace instead.
patches:
  - target:
      kind: Secret
      name: sops-(gpg-wc-name|gpg-from-template-wc-name|age-wc-name)
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: org-org-name  # TODO: change 'org-name' to your organization name
