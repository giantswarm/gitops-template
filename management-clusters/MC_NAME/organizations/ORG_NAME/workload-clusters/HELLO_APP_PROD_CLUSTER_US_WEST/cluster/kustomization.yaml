apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
# The region, its extra node pool and the stage. kustomize applies components
# before the patches in this file, so the cluster's own values come last
# in `valuesFrom`.
components:
  - ../../../../../../../bases/environments/regions/us_west
  - ../../../../../../../bases/environments/regions/us_west/node_pool
  - ../../../../../../../bases/environments/stages/prod
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/managed-by: flux
patches:
  - path: patch_cluster_userconfig.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: \${cluster_name}
resources:
  - ../../../../../../../bases/clusters/capa
  - cluster_userconfig.yaml
  - apps/
