apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-hello-app-staging-1  # TODO: change 'mc-name' to your Management Cluster name and 'hello-app-staging-1' to your cluster name; must be a correct k8s resource name (DNS-like)
  # runs as the organization's `automation` ServiceAccount, which can write only this namespace
  namespace: org-org-name  # TODO: change 'org-name' to your organization name
spec:
  interval: 10m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/HELLO_APP_STAGING_CLUSTER_1"
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_name: "hello-app-staging-1"  # TODO: change 'hello-app-staging-1' to your cluster name; must be a correct k8s resource name (DNS-like)
      organization: "org-name"  # TODO: change 'org-name' to your organization name
  prune: true
  retryInterval: 1m
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of GitRepository pointing to your GitOps repo
    namespace: default  # the namespace of the GitRepository
  timeout: 2m
