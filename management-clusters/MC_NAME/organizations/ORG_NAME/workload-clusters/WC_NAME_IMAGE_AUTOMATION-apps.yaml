apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-image-automation-apps  # TODO: change 'mc-name' to your management cluster's name and 'image-automation' to your cluster name; must be a valid resource name (DNS-like)
spec:
  # the image automation, in apps/, starts once the cluster is up, see WC_NAME_IMAGE_AUTOMATION.yaml
  dependsOn:
    - name: mc-name-clusters-image-automation  # TODO: the name of WC_NAME_IMAGE_AUTOMATION.yaml's Kustomization
  interval: 10m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/WC_NAME_IMAGE_AUTOMATION"
  postBuild:
    substitute:
      cluster_name: "image-automation"  # TODO: change 'image-automation' to your cluster name; must be a valid resource name (DNS-like)
      organization: "${organization}"  # the organisation's namespace Kustomization sets it
  prune: true
  retryInterval: 1m
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of the GitRepository that reads your fork
    namespace: default  # the namespace of that GitRepository
  timeout: 2m
