apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-capi-wc-name  # TODO: change 'mc-name' to your Management Cluster name and 'capi-wc-name' to your cluster name; must be a correct k8s resource name (DNS-like)
  namespace: default
spec:
  # Ready once Cluster API reports the cluster Available. WC_NAME_APPS.yaml
  # depends on this Kustomization, so the apps install once the cluster is up.
  healthCheckExprs:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      current: status.conditions.filter(c, c.type == 'Available').all(c, c.status == 'True')
  healthChecks:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      name: capi-wc-name  # TODO: change to your cluster name, the `cluster_name` below
      namespace: org-org-name  # TODO: change 'org-name' to your organization name, the `organization` below
  interval: 1m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/WC_NAME/mapi/cluster"
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_name: "capi-wc-name"  # TODO: change 'capi-wc-name' to your cluster name; must be a correct k8s resource name (DNS-like)
      organization: "org-name"  # TODO: change 'org-name' to your organization name
      # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/release-aws versioning=docker
      release: "36.2.0"  # TODO: change to the Giant Swarm release the cluster runs
  prune: true
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of GitRepository pointing to your GitOps repo
  # long enough for a new cluster to come up
  timeout: 30m
