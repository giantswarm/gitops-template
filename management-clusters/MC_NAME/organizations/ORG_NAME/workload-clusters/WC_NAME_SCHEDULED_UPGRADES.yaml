apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-scheduled-upgrades  # TODO: change 'mc-name' to your management cluster's name and 'scheduled-upgrades' to your cluster name; must be a valid resource name (DNS-like)
spec:
  # Flux applies a commit here only once the organisation's namespace Kustomization, which
  # applies this one, is Ready at it, so this one's spec is up to date
  dependsOn:
    - name: mc-name-organization-org-name  # TODO: the name of the Kustomization in ../namespace.yaml
      namespace: default
  interval: 10m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/WC_NAME_SCHEDULED_UPGRADES"
  # No `release` here: the cluster's release comes from cluster/release-input-provider.yaml,
  # which moves it to a new version only inside its upgrade window.
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_name: "scheduled-upgrades"  # TODO: change 'scheduled-upgrades' to your cluster name; must be a valid resource name (DNS-like)
      organization: "${organization}"  # the organisation's namespace Kustomization sets it
  prune: true
  retryInterval: 1m
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of the GitRepository that reads your fork
    namespace: default  # the namespace of that GitRepository
  timeout: 2m
