apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-capi-wc-name-apps  # TODO: change 'mc-name' to your management cluster's name and 'capi-wc-name' to your cluster name; must be a valid resource name (DNS-like)
spec:
  # the age key that decrypts the *.enc.yaml files in WC_NAME, see docs/reference/sops-keys.md
  decryption:
    provider: sops
    secretRef:
      name: sops-age-wc-name
  # the secondary apps, in apps/, install once the cluster is up, see WC_NAME.yaml
  dependsOn:
    - name: mc-name-clusters-capi-wc-name  # TODO: the name of WC_NAME.yaml's Kustomization
  interval: 10m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/WC_NAME"
  postBuild:
    substitute:
      cluster_name: "capi-wc-name"  # TODO: change 'capi-wc-name' to your cluster name; must be a valid resource name (DNS-like)
      organization: "${organization}"  # the organisation's namespace Kustomization sets it
  prune: true
  retryInterval: 1m
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of the GitRepository that reads your fork
    namespace: default  # the namespace of that GitRepository
  timeout: 2m
