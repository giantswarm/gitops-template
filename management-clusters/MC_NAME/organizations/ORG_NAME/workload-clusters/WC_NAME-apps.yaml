apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-capi-wc-name-apps  # TODO: change 'mc-name' to your Management Cluster name and 'capi-wc-name' to your cluster name; must stay a DNS-like k8s resource name
  namespace: default
spec:
  # the age key that decrypts the *.enc.yaml files in WC_NAME, see docs/reference/sops-keys.md
  decryption:
    provider: sops
    secretRef:
      name: sops-age-wc-name
  # the secondary apps, in apps/ and app_sets/, install once the
  # cluster is up, see WC_NAME.yaml
  dependsOn:
    - name: mc-name-clusters-capi-wc-name  # TODO: the name of WC_NAME.yaml's Kustomization
  interval: 10m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/WC_NAME"
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_name: "capi-wc-name"  # TODO: change 'capi-wc-name' to your cluster name; must be a correct k8s resource name (DNS-like)
      organization: "org-name"  # TODO: change 'org-name' to your organization name
      # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/release-aws versioning=docker
      release: "36.2.0"  # TODO: change to the Giant Swarm release the cluster runs
  prune: true
  retryInterval: 1m
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of GitRepository pointing to your GitOps repo
  timeout: 2m
