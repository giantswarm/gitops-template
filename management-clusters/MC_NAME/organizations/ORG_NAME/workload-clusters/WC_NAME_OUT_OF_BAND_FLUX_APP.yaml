apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    # ../kustomization.yaml sets the organisation's namespace in its health check
    giantswarm.io/health-check-cluster: "true"
  name: mc-name-clusters-out-of-band-flux-app  # TODO: change 'mc-name' to your Management Cluster name and 'out-of-band-flux-app' to your cluster name; must be a correct k8s resource name (DNS-like)
  namespace: default
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg-wc-name
  # Applies the cluster and its base apps, in cluster/. Ready once Cluster
  # API reports the cluster Available. The Kustomization in WC_NAME_OUT_OF_BAND_FLUX_APP-apps.yaml
  # depends on this one, so the secondary apps install once the cluster is up.
  healthCheckExprs:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      current: status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
  healthChecks:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      name: out-of-band-flux-app  # TODO: change to your cluster name, the `cluster_name` below
      # the organisation's namespace: a fixed placeholder, see ../kustomization.yaml
      namespace: org-ORG_NAME
  interval: 10m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/WC_NAME_OUT_OF_BAND_FLUX_APP/cluster"
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_name: "out-of-band-flux-app"
      organization: "ORG_NAME"  # ../kustomization.yaml sets it from the Organization's name
      # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/release-aws versioning=docker
      release: "36.2.0"  # TODO: change to the Giant Swarm release the cluster runs
  prune: true
  retryInterval: 1m
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of GitRepository pointing to your GitOps repo
  # long enough for a new cluster to come up
  timeout: 30m
