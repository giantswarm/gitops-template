apiVersion: v1
data:
  values: |-
    controller:
      ingressClassResource:
        name: nginx
      config:
        use-forwarded-headers: "false"
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
kind: ConfigMap
metadata:
  name: ${cluster_name}-ingress-nginx-user-values
  namespace: org-${organization}
