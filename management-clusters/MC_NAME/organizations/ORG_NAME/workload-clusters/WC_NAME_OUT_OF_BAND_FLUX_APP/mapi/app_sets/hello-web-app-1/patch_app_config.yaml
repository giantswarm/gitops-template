apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${cluster_name}-hello-world
  namespace: org-${organization}
spec:
  # `valuesFrom` replaces the list inherited from the app set, so the entry the
  # set provides has to be repeated here. Later entries win over earlier ones.
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-hello-world-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-hello-world-user-values
      valuesKey: values
