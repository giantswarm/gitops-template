apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-hello-world-app-auto
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-hello-world-app-auto
    namespace: org-${organization}
  # the HTTPRoute below needs the Gateway API CRDs: every install and upgrade
  # waits until the gateway-api-crds release of the envoy-gateway stack is ready
  dependsOn:
    - name: ${cluster_name}-gateway-api-crds
  install:
    # the target namespace does not exist in a new workload cluster
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  kubeConfig:
    secretRef:
      name: ${cluster_name}-kubeconfig
  releaseName: hello-world-app-auto
  storageNamespace: hello-world-auto
  targetNamespace: hello-world-auto
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  # hello-world's web front end, on the cluster's Gateway (these values win
  # over `valuesFrom`) at
  # `hello-auto.<cluster base domain>`; `hello-auto` is in the Gateway's
  # `listeners.https.subdomains`, see cluster/apps/envoy-gateway-from-template
  values:
    ingress:
      enabled: false
    route:
      enabled: true
      parentRefs:
        - name: giantswarm-default
          namespace: envoy-gateway-system
      hostnames:
        - "hello-auto.{{ .Values.baseDomain }}"
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-hello-world-app-auto-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-hello-world-app-auto-user-secrets
      optional: true
      valuesKey: values
