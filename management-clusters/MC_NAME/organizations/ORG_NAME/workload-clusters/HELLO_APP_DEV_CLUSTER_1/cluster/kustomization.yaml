apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
# The region and the stage. kustomize applies components
# before this kustomization's own patches, so the cluster's own values come last
# in `valuesFrom`.
components:
  - ../../../../../../../bases/environments/regions/eu_central
  - ../../../../../../../bases/environments/stages/dev
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/managed-by: flux
patches:
  - path: patch_cluster_userconfig.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: \${cluster_name}
resources:
  - ../../../../../../../bases/clusters/capa
  - cluster_userconfig.yaml
  - apps/
