apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-cert-manager
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-cert-manager
    namespace: org-${organization}
  install:
    # the target namespace does not exist in a new workload cluster
    createNamespace: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: cert-manager
  # cert-manager-app names its CRDs, ClusterRoles and webhook configurations the same
  # whatever the release, so the install fails ("exists and cannot be imported") on a
  # cluster where cert-manager-app is already installed, such as Giant Swarm's default
  # cert-manager app
  storageNamespace: cert-manager
  targetNamespace: cert-manager
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-cert-manager-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-cert-manager-user-secrets
      optional: true
      valuesKey: values
