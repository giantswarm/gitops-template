apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-cert-manager
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-cert-manager
    namespace: org-${organization}
  install:
    # the target namespace does not exist in a new workload cluster
    createNamespace: true
    # cert-manager-app names its CRDs, ClusterRoles and webhook configurations the same
    # whatever the release. Without this, Helm would take over those of a cert-manager-app
    # already in the cluster, such as Giant Swarm's default cert-manager app; with it, the
    # install fails with "exists and cannot be imported into the current release"
    disableTakeOwnership: true
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m
  releaseName: cert-manager
  storageNamespace: cert-manager
  targetNamespace: cert-manager
  timeout: 10m
  upgrade:
    # see install.disableTakeOwnership
    disableTakeOwnership: true
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-cert-manager-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-cert-manager-user-secrets
      optional: true
      valuesKey: values
