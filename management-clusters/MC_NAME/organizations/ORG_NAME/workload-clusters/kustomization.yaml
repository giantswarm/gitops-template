# The workload clusters' Flux Kustomizations, one or more per cluster directory here. The
# organisation's namespace Kustomization, in ../namespace.yaml, applies them into the
# organisation's namespace, as ../namespace/kustomization.yaml lists this directory; the management
# cluster's Kustomization doesn't. They apply the cluster directories as the organisation's
# `automation` ServiceAccount, and decrypt with the cluster keys in ../namespace/secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/managed-by: flux
resources:
  - WC_NAME.yaml
  - WC_NAME-apps.yaml
  - HELLO_APP_DEV_CLUSTER_1.yaml
  - HELLO_APP_PROD_CLUSTER_EU_CENTRAL.yaml
  - HELLO_APP_PROD_CLUSTER_US_WEST.yaml
  - HELLO_APP_STAGING_CLUSTER_1.yaml
  - WC_NAME_OUT_OF_BAND_FLUX_APP.yaml
  - WC_NAME_OUT_OF_BAND_FLUX_APP-apps.yaml
  - WC_NAME_OUT_OF_BAND_NO_FLUX_APP.yaml
  - WC_NAME_OUT_OF_BAND_NO_FLUX_APP-apps.yaml
  - WC_NAME_OUT_OF_BAND_NO_FLUX_APP-direct.yaml
  - WC_NAME_SCHEDULED_UPGRADES.yaml
  - WC_NAME_IMAGE_AUTOMATION.yaml
  - WC_NAME_IMAGE_AUTOMATION-apps.yaml
  - WC_NAME_IMAGE_AUTOMATION-direct.yaml
