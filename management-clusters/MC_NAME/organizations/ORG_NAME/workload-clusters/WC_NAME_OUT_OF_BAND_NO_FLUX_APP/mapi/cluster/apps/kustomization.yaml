apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
# The base apps: the cluster's Kustomization applies them with the cluster, and
# they install once the cluster is up. Secondary apps go into mapi/apps.
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/cluster: ${cluster_name}
      giantswarm.io/managed-by: flux
resources:
  - envoy-gateway-from-template/
