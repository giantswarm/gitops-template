apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${cluster_name}-ingress-nginx
  namespace: kube-system
spec:
  # `valuesFrom` replaces the list inherited from the base, so the base entry
  # has to be repeated here. Later entries win over earlier ones.
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-ingress-nginx-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-tmpl-ingress-nginx-user-values
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-tmpl-ingress-nginx-user-secret
      valuesKey: values
