# External Secrets Operator writes the app's secret values from your secret manager into the
# Secret the HelmRelease reads. The store is the one in docs/appendices.md, "Secret store for
# testing": point `secretStoreRef` at your own store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${cluster_name}-hello-world-standalone-user-secrets
  namespace: org-${organization}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitops-test
  target:
    name: ${cluster_name}-hello-world-standalone-user-secrets
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  data:
    - secretKey: values
      remoteRef:
        key: gitops/hello-world-values
