apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
configMapGenerator:
  - files:
      - values=user_config_gateway_api_config.yaml
    name: ${cluster_name}-gateway-api-config-user-values
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
namespace: org-${organization}
resources:
  # config you'd rather not keep in plain text goes into a SOPS-encrypted Secret,
  # see docs/guides/add-app.md
  - secret.enc.yaml
  - ../../../../../../../../../bases/apps/envoy-gateway
