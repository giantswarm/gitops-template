# A password pushed into the workload cluster through the SecretStore
# `${cluster_name}-eso-cluster-store`, which the Kyverno Policy in the organisation's
# workload-cluster-secret-stores directory generates from the cluster's kubeconfig Secret. The Password generator of External Secrets Operator makes the value, so
# none is kept in Git. The PushSecret writes it into the Secret `pushed-password`, key
# `password`, in the workload cluster's `default` namespace. `updatePolicy: IfNotExists`
# keeps the first password there: the generator makes a new one at every refresh.
# Until Kyverno and ESO have made the store, ESO retries the PushSecret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${cluster_name}-pushed-password
  namespace: org-${organization}
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ${cluster_name}-pushed-password
  namespace: org-${organization}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: SecretStore
      name: ${cluster_name}-eso-cluster-store
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: ${cluster_name}-pushed-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: pushed-password
          property: password
