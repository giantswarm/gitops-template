apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/cluster: ${cluster_name}
      giantswarm.io/managed-by: flux
resources:
  - hello-world/externalsecret.yaml
  - hello-world/helm-release.yaml
  - hello-world/oci-repository.yaml
  - hello-world-automatic-updates/helm-release.yaml
  - hello-world-automatic-updates/oci-repository.yaml
  - hello-world-from-template/
  - workload-cluster-secrets/secret-store.yaml
  - workload-cluster-secrets/common-secret.yaml
  - workload-cluster-secrets/generated-password.yaml
  - pushed-password/pushed-password.yaml
  - pushed-kubeconfig/pushed-kubeconfig.yaml
