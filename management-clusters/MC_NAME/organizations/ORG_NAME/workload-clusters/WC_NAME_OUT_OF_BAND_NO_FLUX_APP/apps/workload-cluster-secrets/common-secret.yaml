# A secret every workload cluster needs, such as a registry token, kept once in your secret
# manager. The ExternalSecret reads it into the management cluster, and the PushSecret copies it
# into the workload cluster. The store is the one in docs/appendices.md, "Secret store for
# testing": point `secretStoreRef` at your own store, for example one of bases/secret_stores.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${cluster_name}-common-secret
  namespace: org-${organization}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gitops-test
  target:
    name: ${cluster_name}-common-secret
  data:
    - secretKey: token
      remoteRef:
        key: workload-clusters-common-token
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ${cluster_name}-common-secret
  namespace: org-${organization}
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: ${cluster_name}-workload-cluster
  selector:
    secret:
      name: ${cluster_name}-common-secret
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: common-secret
          property: token
