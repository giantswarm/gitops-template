# The workload cluster as a store that External Secrets Operator pushes Secrets into. ESO reaches
# the cluster through the kubeconfig Secret the management cluster has for it, so the store works
# as soon as the cluster is up. The cluster's apps Kustomization applies it once the cluster is ready.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ${cluster_name}-workload-cluster
  namespace: org-${organization}
spec:
  provider:
    kubernetes:
      authRef:
        name: ${cluster_name}-kubeconfig
        key: value
      # a namespace every new cluster has
      remoteNamespace: default
