# A password nobody writes by hand: the Password generator of External Secrets Operator makes one
# for each cluster. `refreshPolicy: CreatedOnce` keeps it, where the default would make a new one
# at every refresh. The PushSecret copies it into the workload cluster.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${cluster_name}-password
  namespace: org-${organization}
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${cluster_name}-generated-password
  namespace: org-${organization}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ${cluster_name}-generated-password
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${cluster_name}-password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ${cluster_name}-generated-password
  namespace: org-${organization}
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: ${cluster_name}-workload-cluster
  selector:
    secret:
      name: ${cluster_name}-generated-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: generated-password
          property: password
