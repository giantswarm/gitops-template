# This cluster's kubeconfig, pushed into another cluster, for a tool there that needs to reach
# this one. The PushSecret copies the kubeconfig Secret Cluster API writes for this cluster,
# `${cluster_name}-kubeconfig`, through the SecretStore the Kyverno policies in the
# organisation's multicluster/secret-stores directory generate for the other cluster, into a
# Secret of the same name, key `value`, in that cluster's `default` namespace.
# The kubeconfig signs in as cluster-admin of this cluster: whoever may read Secrets in that
# namespace of the other cluster gets it too.
# Until Kyverno and ESO have made the other cluster's store, ESO retries the PushSecret.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ${cluster_name}-pushed-kubeconfig
  namespace: org-${organization}
spec:
  refreshInterval: 1h
  # ESO's default: a renewed kubeconfig replaces the copy at the next refresh
  updatePolicy: Replace
  secretStoreRefs:
    - kind: SecretStore
      name: tools-cluster-eso-cluster-store  # TODO: change 'tools-cluster' to the cluster that runs the tool
  selector:
    secret:
      name: ${cluster_name}-kubeconfig
  data:
    - match:
        secretKey: value
        remoteRef:
          remoteKey: ${cluster_name}-kubeconfig
          property: value
