apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
components:
  - ../../../../../../../bases/environments/regions/eu_central
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/managed-by: flux
# The cluster base pins its release in an OCIRepository. Here the ResourceSet in
# release-resource-set.yaml renders that OCIRepository instead, at the version
# its provider picks inside the upgrade window, so the patch drops the base's.
patches:
  - path: patch_delete_release_source.yaml
resources:
  - ../../../../../../../bases/clusters/capa/template
  - release-input-provider.yaml
  - release-resource-set.yaml
