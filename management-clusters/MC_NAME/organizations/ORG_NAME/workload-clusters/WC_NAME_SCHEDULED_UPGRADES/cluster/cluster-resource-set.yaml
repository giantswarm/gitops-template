# The whole cluster: its OCIRepository and its HelmRelease, as the cluster base
# has them, at the release the provider in release-input-provider.yaml picks.
# The HelmRelease upgrades the cluster when the tag changes. Until the provider
# has a version, the cluster isn't created: see the first install in
# release-input-provider.yaml.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}
  namespace: org-${organization}
spec:
  # Until the provider is Ready with a version, the ResourceSet leaves what it
  # rendered as it is. The version goes only when no release matches the range:
  # a provider that can't read the registry keeps its last one, and a deleted
  # provider stalls the ResourceSet. Without a version the ResourceSet would
  # render nothing and let go of both objects; prune: disabled keeps them.
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: ${cluster_name}-release
      namespace: org-${organization}
      ready: true
      readyExpr: >-
        status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        && has(status.exportedInputs)
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: ${cluster_name}-release
  serviceAccountName: automation
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        annotations:
          # the ResourceSet never deletes it, not even when the ResourceSet is deleted
          fluxcd.controlplane.io/prune: disabled
        labels:
          giantswarm.io/cluster: ${cluster_name}
          giantswarm.io/managed-by: flux
          # nobody can delete it, Flux included, until this label is removed
          giantswarm.io/prevent-deletion: "true"
        name: ${cluster_name}
        namespace: << inputs.provider.namespace >>
      spec:
        interval: 10m0s
        provider: generic
        ref:
          # the chart version is the Giant Swarm release
          tag: << inputs.tag | quote >>
        timeout: 1m0s
        url: oci://gsoci.azurecr.io/charts/giantswarm/release-aws
    # Flux merges the `valuesFrom` entries in order, as for the cluster base, see
    # bases/clusters/capa/cluster.yaml. A component's patch targets a HelmRelease,
    # which kustomize doesn't see inside a ResourceSet, so the region's entry is
    # written out here, after the base's. patch_cluster_userconfig.yaml appends
    # the cluster's own values after it.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        annotations:
          # Deleting this HelmRelease deletes the cluster. The ResourceSet never
          # deletes it, not even when the ResourceSet is deleted or its file is
          # deleted from Git; delete it by hand to delete the cluster.
          fluxcd.controlplane.io/prune: disabled
        labels:
          giantswarm.io/cluster: ${cluster_name}
          giantswarm.io/managed-by: flux
          # nobody can delete it, Flux included, until this label is removed
          giantswarm.io/prevent-deletion: "true"
        name: ${cluster_name}
        namespace: << inputs.provider.namespace >>
      spec:
        chartRef:
          kind: OCIRepository
          name: ${cluster_name}
        install:
          # Flux remediates a failed install by uninstalling it, which deletes the
          # cluster. Keep a failed install failed instead.
          remediation:
            remediateLastFailure: false
        interval: 5m0s
        releaseName: ${cluster_name}
        serviceAccountName: automation
        storageNamespace: org-${organization}
        targetNamespace: org-${organization}
        timeout: 10m0s
        upgrade:
          remediation:
            remediateLastFailure: true
            retries: 10
            strategy: rollback
        valuesFrom:
          - kind: ConfigMap
            name: cluster-app-installation-values
            valuesKey: values.yaml
          - kind: ConfigMap
            name: ${cluster_name}-config
            valuesKey: values
          - kind: ConfigMap
            name: ${cluster_name}-region-config
            valuesKey: values
