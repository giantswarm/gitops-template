apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-capi-wc-name-apps  # TODO: change 'mc-name' to your Management Cluster name and 'capi-wc-name' to your cluster name; must be a correct k8s resource name (DNS-like)
  namespace: default
spec:
  # the apps install once the cluster is up, see WC_NAME.yaml
  dependsOn:
    - name: mc-name-clusters-capi-wc-name  # TODO: the name of WC_NAME.yaml's Kustomization
  interval: 1m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/WC_NAME/mapi/apps"
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_name: "capi-wc-name"  # TODO: change 'capi-wc-name' to your cluster name; must be a correct k8s resource name (DNS-like)
      organization: "org-name"  # TODO: change 'org-name' to your organization name
      # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/release-aws versioning=docker
      release: "36.2.0"  # TODO: change to the Giant Swarm release the cluster runs
  prune: true
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of GitRepository pointing to your GitOps repo
  timeout: 2m
