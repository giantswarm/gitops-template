apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-hello-app-prod-euc  # TODO: change 'mc-name' to your Management Cluster name and 'hello-app-prod-euc' to your cluster name; must be a correct k8s resource name (DNS-like)
  namespace: default
spec:
  interval: 10m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/HELLO_APP_PROD_CLUSTER_EU_CENTRAL"
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_name: "hello-app-prod-euc"  # TODO: change 'hello-app-prod-euc' to your cluster name; must be a correct k8s resource name (DNS-like)
      organization: "ORG_NAME"  # ../kustomization.yaml sets it from the Organization's name
  prune: true
  retryInterval: 1m
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of GitRepository pointing to your GitOps repo
  timeout: 2m
