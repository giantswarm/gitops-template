apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
# What runs on the management cluster, in the organisation's namespace, for the
# cluster: here the image automation that keeps out-of-band/helloworld current.
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/cluster: ${cluster_name}
      giantswarm.io/managed-by: flux
resources:
  - image-automation/externalsecret.yaml
  - image-automation/git-repository.yaml
  - image-automation/image-repository.yaml
  - image-automation/image-policy.yaml
  - image-automation/image-update-automation.yaml
