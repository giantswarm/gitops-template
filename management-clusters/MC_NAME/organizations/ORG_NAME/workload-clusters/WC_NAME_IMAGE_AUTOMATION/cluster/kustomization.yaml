apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
# The region. kustomize applies components before the patches in this
# file, so the region comes before the cluster's own values in `valuesFrom`.
# `kubectl gs gitops add workload-cluster` writes the rest of this file, but
# with the deprecated `commonLabels`. Move its labels to the `labels` list
# below; `kustomize edit fix` would also add `includeSelectors: true`.
components:
  - ../../../../../../../bases/environments/regions/eu_central
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/managed-by: flux
patches:
  - path: patch_cluster_userconfig.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: \${cluster_name}
resources:
  - ../../../../../../../bases/clusters/capa
  - cluster_userconfig.yaml
