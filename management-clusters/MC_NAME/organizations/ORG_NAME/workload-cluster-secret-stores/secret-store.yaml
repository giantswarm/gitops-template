# The store the policy's ExternalSecrets read the clusters' kubeconfig Secrets through. It reads
# the organisation's namespace as its `automation` ServiceAccount, which Giant Swarm's
# rbac-operator creates there.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: default
spec:
  provider:
    kubernetes:
      # limit ESO to this org namespace
      remoteNamespace: org-ORG_NAME
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: automation
