# The version of hello-world that the hello-world-scheduled ResourceSet installs:
# the highest tag in the range, picked only inside the upgrade window. Outside it,
# Flux Operator doesn't read the registry, so a new tag waits for the next window.
# A new provider exports no version until its first window opens; to install at
# once, force it, see docs/guides/automatic-updates.md.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: hello-world-scheduled-version
  namespace: org-org-name  # TODO: change 'org-name' to your organization name
spec:
  type: OCIArtifactTag
  url: oci://gsoci.azurecr.io/charts/giantswarm/hello-world
  filter:
    # every release below the next major version, which might bring breaking changes
    semver: '>=3.0.0 <4.0.0'
    # only the highest tag: each exported tag would be installed as a release of its own
    limit: 1
  schedule:
    # Monday to Thursday, 09:00 to 17:00 in Berlin
    - cron: "0 9 * * 1-4"
      timeZone: Europe/Berlin
      window: 8h
