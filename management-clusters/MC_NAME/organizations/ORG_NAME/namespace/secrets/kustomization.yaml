# The organisation's Secrets, the SOPS keys its workload clusters' Kustomizations decrypt with
# among them. The master key encrypts the keys, see .sops.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
kind: Kustomization
# Flux decrypts with the SOPS keys here: deleting one stops GitOps for its clusters
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
labels:
  - pairs:
      giantswarm.io/managed-by: flux
      # nobody can delete them, Flux included, until this label is removed
      giantswarm.io/prevent-deletion: "true"
resources:
  - WC_NAME.gpgkey.enc.yaml
  - FROM_TEMPLATE_WC_NAME.gpgkey.enc.yaml
  - WC_NAME.agekey.enc.yaml
