# A Kyverno Policy that gives every workload cluster of the organisation a SecretStore, and the
# organisation's SecretStore it reads through. Everything is in the organisation's namespace,
# where the organisation's namespace Kustomization puts it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policy.yaml
  - secret-store.yaml
