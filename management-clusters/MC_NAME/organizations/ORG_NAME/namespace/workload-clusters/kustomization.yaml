# The workload clusters' Flux Kustomizations that live in the organisation's namespace, because
# the kubeconfig Secret they read is there: the -direct ones. The other Kustomizations of a
# cluster live in `default`, in ../../workload-clusters.
apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/managed-by: flux
resources:
  - WC_NAME_OUT_OF_BAND_NO_FLUX_APP-direct.yaml
