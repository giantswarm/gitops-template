apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mc-name-clusters-hello-app-dev-1  # TODO: change 'mc-name' to your Management Cluster name and 'hello-app-dev-1' to your cluster name; must be a correct k8s resource name (DNS-like)
spec:
  # Flux applies a commit here only once the organisation's namespace Kustomization, which
  # applies this one, is Ready at it, so this one's spec is up to date
  dependsOn:
    - name: mc-name-organization-org-name  # TODO: the name of the Kustomization in ../../namespace.yaml
      namespace: default
  interval: 10m
  path: "./management-clusters/MC_NAME/organizations/ORG_NAME/workload-clusters/HELLO_APP_DEV_CLUSTER_1"
  postBuild:
    substitute:
      cluster_description: "description"
      cluster_name: "hello-app-dev-1"  # TODO: change 'hello-app-dev-1' to your cluster name; must be a correct k8s resource name (DNS-like)
      organization: "${organization}"  # the organisation's namespace Kustomization sets it
  prune: true
  retryInterval: 1m
  serviceAccountName: automation
  sourceRef:
    kind: GitRepository
    name: your-repo  # TODO: change "your-repo" to the name of GitRepository pointing to your GitOps repo
    namespace: default  # the namespace of that GitRepository
  timeout: 2m
