# External Secrets Operator writes the GitHub token of the organisation's Provider from your
# secret manager, the same token as the management cluster's Provider. The store is the one in
# docs/how-to/external-secrets.md, "A secret store for testing": point `secretStoreRef` at your own store. With
# SOPS, commit an encrypted Secret of the same name instead, see docs/how-to/commit-statuses.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-commit-status-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gitops-test
  target:
    name: github-commit-status-token
  data:
    - secretKey: token
      remoteRef:
        key: gitops/github-commit-status-token
