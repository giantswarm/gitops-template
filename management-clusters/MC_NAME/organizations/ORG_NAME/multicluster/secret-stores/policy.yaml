# Two Kyverno policies that give every workload cluster of the organisation a SecretStore that
# reaches it, made as soon as Cluster API writes the cluster's kubeconfig Secret. They work in two
# hops, because the store can't use the kubeconfig as Cluster API writes it:
#
# 1. `generate-eso-cluster-auth-from-kubeconfig` generates, for each kubeconfig Secret, an
#    ExternalSecret that reads it through the store `default` and writes the client certificate
#    and key, the cluster's CA and its API server into the Secret `<cluster>-eso-cluster-auth`.
# 2. `generate-eso-cluster-store-from-cluster-auth` generates, for each of those Secrets, the
#    SecretStore `<cluster>-eso-cluster-store`, which signs in to the cluster with them.
#
# `generateExisting` covers the clusters that exist already, and `synchronize` deletes what the
# policies generated when the Secret that triggered them goes, and puts back what someone changes
# or deletes by hand.
#
# A NamespacedGeneratingPolicy acts only in its own namespace, so the organisation's `automation`
# ServiceAccount, which may do anything in the namespace but create nothing cluster-scoped, can
# apply it. What the policies generate goes into the policy's namespace, as their templates name
# none. Kyverno's background controller does the work, and needs rights the management cluster has
# to grant it: see docs/how-to/workload-cluster-secrets.md, "What Kyverno needs".
#
# The templates are Kyverno's YAML templates, beta since Kyverno 1.19: `(( ... ))` is a CEL
# expression, filled in from the Secret that triggered the policy (`object`). The `{{ ... }}` in
# the ExternalSecret are External Secrets Operator's own template, which Kyverno leaves alone.
apiVersion: policies.kyverno.io/v1
kind: NamespacedGeneratingPolicy
metadata:
  name: generate-eso-cluster-auth-from-kubeconfig
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
    # Cluster API labels and types every Secret it writes for a cluster this way, the
    # kubeconfig among them
    objectSelector:
      matchExpressions:
        - key: cluster.x-k8s.io/cluster-name
          operator: Exists
  matchConditions:
    - name: written-by-cluster-api
      expression: object.type == 'cluster.x-k8s.io/secret'
    # only the cluster's kubeconfig, <cluster>-kubeconfig: not its CA or other certificates, nor
    # an EKS cluster's <cluster>-user-kubeconfig
    - name: the-kubeconfig
      expression: >-
        object.metadata.name ==
        object.metadata.labels['cluster.x-k8s.io/cluster-name'] + '-kubeconfig'
  variables:
    - name: cluster
      expression: object.metadata.labels['cluster.x-k8s.io/cluster-name']
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: (( variables.cluster ))-eso-cluster-auth
          spec:
            refreshInterval: 1m
            secretStoreRef:
              kind: SecretStore
              name: default
            target:
              name: (( variables.cluster ))-eso-cluster-auth
              creationPolicy: Owner
              deletionPolicy: Delete
              template:
                engineVersion: v2
                mergePolicy: Replace
                templateFrom:
                  - target: Data
                    literal: |-
                      {{ $kubeconfig := index . "(( object.metadata.name ))" | fromYaml }}
                      {{ $value := index $kubeconfig "value" | fromYaml }}
                      {{ $ca := index $value "clusters" 0 "cluster" "certificate-authority-data" | b64dec }}
                      {{ $crt := index $value "users" 0 "user" "client-certificate-data" | b64dec }}
                      {{ $key := index $value "users" 0 "user" "client-key-data" | b64dec }}
                      {{ $server := index $value "clusters" 0 "cluster" "server" }}
                      tls.crt: "{{ range $_, $v := $crt | splitList "\n" }}{{ $v }}\n{{ end }}"
                      tls.key: "{{ range $_, $v := $key | splitList "\n" }}{{ $v }}\n{{ end }}"
                      ca.crt: "{{ range $_, $v := $ca | splitList "\n" }}{{ $v }}\n{{ end }}"
                      server: "{{ $server }}"
            dataFrom:
              - find:
                  name:
                    # exactly the Secret that triggered the policy, <cluster>-kubeconfig, and
                    # not, say, another-<cluster>-kubeconfig
                    regexp: ^(( object.metadata.name ))$
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedGeneratingPolicy
metadata:
  name: generate-eso-cluster-store-from-cluster-auth
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
    # External Secrets Operator labels every Secret it writes this way, so Kyverno isn't asked
    # about any other Secret in the namespace
    objectSelector:
      matchLabels:
        reconcile.external-secrets.io/managed: "true"
  matchConditions:
    - name: a-cluster-auth-secret
      expression: object.metadata.name.endsWith('-eso-cluster-auth')
    # ESO writes every key at once; this waits for the Secret to have them
    - name: has-the-server
      expression: has(object.data) && has(object.data.server)
  variables:
    - name: cluster
      expression: >-
        object.metadata.name.substring(0,
        size(object.metadata.name) - size('-eso-cluster-auth'))
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: external-secrets.io/v1
          kind: SecretStore
          metadata:
            name: (( variables.cluster ))-eso-cluster-store
          spec:
            provider:
              kubernetes:
                # where the store reads and writes Secrets in the workload cluster: the namespace
                # has to exist there, and the `org-*` namespaces exist only on the management
                # cluster
                remoteNamespace: default
                server:
                  # the Secret's data is base64-encoded
                  url: (( string(base64.decode(object.data.server)) ))
                  caProvider:
                    type: Secret
                    name: (( object.metadata.name ))
                    key: ca.crt
                auth:
                  cert:
                    clientCert:
                      name: (( object.metadata.name ))
                      key: tls.crt
                    clientKey:
                      name: (( object.metadata.name ))
                      key: tls.key
