# GitHub only closes issues named with `Closes #N` when a pull request merges
# into the default branch. While the rebuild collects changes on
# `template-rebuild`, this workflow closes them instead.
#
# Remove this workflow before `template-rebuild` merges into `main`.
name: close-linked-issues

on:
  pull_request:
    types: [closed]
    branches: [template-rebuild]

permissions: {}

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues named in the pull request body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Only closing statements at the very start of a line count, as in
          # `Closes #12`, `Closes #12, closes #13 and #14` or `Fixes: #12`.
          # Text after them on the same line is ignored. A keyword in the
          # middle of a sentence or in a list item ("whoever fixes #12",
          # "- Fix #12") doesn't close anything: a looser match closed
          # issues that a pull request only mentioned.
          keyword='(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+'
          issues=$(printf '%s\n' "${PR_BODY}" |
            grep -oiE "^[[:space:]]*${keyword}#[0-9]+([[:space:]]*(,|and)?[[:space:]]*(${keyword})?#[0-9]+)*" |
            grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)
          if [ -z "${issues}" ]; then
            echo "No linked issues in #${PR_NUMBER}."
            exit 0
          fi
          for n in ${issues}; do
            info=$(gh api "repos/${GH_REPO}/issues/${n}" \
              --jq '[.state, (has("pull_request") | tostring)] | @tsv' 2>/dev/null || echo "missing")
            state=${info%%$'\t'*}
            is_pr=${info##*$'\t'}
            if [ "${info}" = "missing" ]; then
              echo "#${n} isn't an issue in this repository, skipping."
            elif [ "${is_pr}" = "true" ]; then
              echo "#${n} is a pull request, skipping."
            elif [ "${state}" = "closed" ]; then
              echo "#${n} is already closed."
            else
              gh issue close "${n}" --reason completed \
                --comment "Done in #${PR_NUMBER}, merged into \`template-rebuild\`."
            fi
          done
