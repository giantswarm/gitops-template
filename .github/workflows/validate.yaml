name: validate

on:
  # Every pull request, whatever its base branch.
  pull_request:
  # The post-merge check: the state of main after a merge, which no pull
  # request run has tested when several pull requests merge without a rebase.
  push:
    branches: [main]

# One run per pull request, or per branch for pushes. A new commit on a pull
# request cancels the run for the commit it replaces. A push to a branch lets
# the run in progress finish, so the post-merge result is never cut short;
# while it runs, GitHub keeps only the newest queued push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: giantswarm/github-workflows/.github/workflows/gitops-validate.yaml@01751540d4610548c37fe0b63aa719d68be3704f # main
    with:
      # Matches [requires] python_version in tests/ats/Pipfile.
      # renovate: datasource=python-version depName=python versioning=python
      python_version: "3.12"
      # The kubeconform of tools/test-all-ff.
      # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
      kubeconform_ver: "0.8.0"
      # The kind test cluster runs kind's default node image, as the shared
      # workflow doesn't pass one. kind v0.32.0 defaults to kindest/node:v1.36.1,
      # the Kubernetes minor version of the management clusters.
      # renovate: datasource=github-releases depName=kubernetes-sigs/kind extractVersion=^v(?<version>.+)$
      kind_ver: "0.32.0"
      # The flux-app chart the kind test installs: the version on the
      # management clusters (Flux v2.7.5), as in tools/test-all-ff.
      # renovate: datasource=helm depName=flux-app registryUrl=https://giantswarm.github.io/giantswarm-catalog/
      gitops_flux_app_version: "1.12.2"
      # Installs app-operator and chart-operator in the kind test. 0.27.0 is
      # the shared workflow's default too, set here so it is pinned with the rest.
      # renovate: datasource=github-releases depName=giantswarm/apptestctl extractVersion=^v(?<version>.+)$
      apptestctl_ver: "0.27.0"
      # Every Flux Kustomization has to get ready. The -direct out-of-band one
      # targets a workload cluster; tests/ats creates a vCluster in the kind
      # cluster for it. Set explicitly, as the shared workflow's default names an object.
      gitops_ignored_objects: ""
    secrets:
      # Empty on a pull request from a fork, where tests/ats skips the tests
      # that need the kind cluster.
      GITOPS_MASTER_GPG_KEY: ${{ secrets.GITOPS_MASTER_GPG_KEY }}
