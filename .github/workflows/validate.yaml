name: validate

on:
  # Every pull request, whatever its base branch.
  pull_request:
  # The post-merge check: the state of main after a merge, which no pull
  # request run has tested when several pull requests merge without a rebase.
  push:
    branches: [main]

# One run per pull request, or per branch for pushes. A new commit on a pull
# request cancels the run for the commit it replaces. A push to a branch lets
# the run in progress finish, so the post-merge result is never cut short;
# while it runs, GitHub keeps only the newest queued push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: giantswarm/github-workflows/.github/workflows/gitops-validate.yaml@main
    with:
      # Matches [requires] python_version in tests/ats/Pipfile. The shared
      # workflow defaults to 3.9, which ubuntu-latest (26.04) no longer has.
      python_version: "3.12"
      # The out-of-band Kustomization targets a workload cluster the kind test
      # cluster doesn't have, so it never becomes ready. The shared workflow's
      # default still names it by its old name.
      gitops_ignored_objects: "org-org-name/mc-name-clusters-mapi-out-of-band-no-flux-direct"
    secrets:
      GITOPS_MASTER_GPG_KEY: ${{ secrets.GITOPS_MASTER_GPG_KEY }}
