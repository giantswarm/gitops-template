name: validate

on:
  pull_request:
  push:
    branches: [HEAD_BRANCH, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: giantswarm/github-workflows/.github/workflows/gitops-validate.yaml@main
    with:
      # Matches [requires] python_version in tests/ats/Pipfile. The shared
      # workflow defaults to 3.9, which ubuntu-latest (26.04) no longer has.
      python_version: "3.12"
    secrets:
      GITOPS_MASTER_GPG_KEY: ${{ secrets.GITOPS_MASTER_GPG_KEY }}
