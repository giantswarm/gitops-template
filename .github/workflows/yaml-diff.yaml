name: yaml-diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  # The diff is only ever posted as a pull request comment. A pull request from
  # a fork gets a read-only token, so the comment can't be posted: the job runs
  # only for pull requests from a branch of this repository.
  # Temporary: remove this check and the skipped-for-fork job once the shared
  # workflow skips the comment itself (the github-workflows issue).
  yaml-diff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: giantswarm/github-workflows/.github/workflows/yaml-diff.yaml@01751540d4610548c37fe0b63aa719d68be3704f # main

  # Says why the diff comment is missing on a pull request from a fork.
  skipped-for-fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say why there is no YAML diff comment
        run: >-
          echo "::notice title=YAML diff skipped::This pull request comes from a fork,
          and GitHub gives pull requests from forks a read-only token, so the YAML
          source diff can't be posted as a comment. The changed files are in the
          pull request's Files changed tab."
