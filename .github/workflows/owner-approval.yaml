# Required check for pull requests into `template-rebuild`: passes only when
# the repository owner has approved the pull request's current content.
#
# To approve, the owner submits a pull request review (type "Comment" works)
# whose body contains a line `/approve`. A later review with `/unapprove`, or
# one requesting changes, withdraws it.
#
# An approval belongs to the change, not to a commit. It stays valid while the
# pull request's own diff (against its merge base, changed lines only) is the
# same as at the approved commit, so rebasing onto `template-rebuild` keeps it.
# A new commit, or a conflict resolution that changes the pull request's own
# lines, needs a new approval.
#
# Remove this workflow before `template-rebuild` merges into `main`.
name: owner-approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

concurrency:
  group: owner-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owner-approval:
    if: github.event.pull_request.base.ref == 'template-rebuild'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      APPROVER: mproffitt
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the pull request with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the owner's latest approval
        id: approval
        run: |
          set -euo pipefail
          # Reviews come back oldest first. Track the approval state in order.
          approved=""
          while IFS=$'\t' read -r state commit body64; do
            body=$(printf '%s' "${body64}" | base64 -d)
            if [ "${state}" = "DISMISSED" ]; then
              continue
            fi
            if printf '%s\n' "${body}" | grep -qE '^[[:space:]]*/unapprove[[:space:]]*$' \
              || [ "${state}" = "CHANGES_REQUESTED" ]; then
              approved=""
            elif printf '%s\n' "${body}" | grep -qE '^[[:space:]]*/approve[[:space:]]*$'; then
              approved="${commit}"
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == env.APPROVER)
                  | [.state, .commit_id, ((.body // "") | @base64)] | @tsv')
          if [ -z "${approved}" ]; then
            echo "::error::No /approve review from ${APPROVER} on #${PR_NUMBER}."
            exit 1
          fi
          echo "commit=${approved}" >> "${GITHUB_OUTPUT}"
          echo "Approved at ${approved}."

      - name: Compare the approved change with the current one
        env:
          APPROVED_SHA: ${{ steps.approval.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${BASE_REF}"
          if ! git cat-file -e "${APPROVED_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags origin "${APPROVED_SHA}" || {
              echo "::error::The approved commit ${APPROVED_SHA} can't be fetched any more. Approve again."
              exit 1
            }
          fi
          change_id() {
            local base
            base=$(git merge-base "origin/${BASE_REF}" "$1")
            git diff -U0 "${base}" "$1" | git patch-id --stable | cut -d' ' -f1
          }
          approved_id=$(change_id "${APPROVED_SHA}")
          current_id=$(change_id "${HEAD_SHA}")
          echo "approved ${APPROVED_SHA}: ${approved_id:-<empty>}"
          echo "current  ${HEAD_SHA}: ${current_id:-<empty>}"
          if [ -z "${current_id}" ] || [ "${approved_id}" != "${current_id}" ]; then
            echo "::error::The pull request changed since ${APPROVER} approved it. Review it again and approve."
            exit 1
          fi
          echo "The approved change is unchanged."
