# Owner approval gate for pull requests into `template-rebuild`.
#
# The result is reported as the commit status `owner-approval-status` on the
# pull request's head commit, which is the required check. A commit status,
# unlike a job's check run, is replaced by the next status with the same
# context, so the run triggered by the owner's review overrides the earlier run
# triggered by the push.
#
# To approve, the owner submits a pull request review (type "Comment" works)
# whose body contains a line `/approve`. A later review with `/unapprove`, or
# one requesting changes, withdraws it.
#
# An approval belongs to the change, not to a commit. It stays valid while the
# pull request's own diff (against its merge base, changed lines only) is the
# same as at the approved commit, so rebasing onto `template-rebuild` keeps it.
# A new commit, or a conflict resolution that changes the pull request's own
# lines, needs a new approval.
#
# Remove this workflow before `template-rebuild` merges into `main`.
name: owner-approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

concurrency:
  group: owner-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event.pull_request.base.ref == 'template-rebuild'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      APPROVER: mproffitt
      CONTEXT: owner-approval-status
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the pull request with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate the owner's approval
        id: evaluate
        run: |
          set -euo pipefail
          verdict() {
            echo "state=$1" >> "${GITHUB_OUTPUT}"
            echo "description=$2" >> "${GITHUB_OUTPUT}"
            echo "$2"
          }

          # Reviews come back oldest first. Track the approval state in order.
          approved=""
          while IFS=$'\t' read -r state commit body64; do
            body=$(printf '%s' "${body64}" | base64 -d)
            if [ "${state}" = "DISMISSED" ]; then
              continue
            fi
            if printf '%s\n' "${body}" | grep -qE '^[[:space:]]*/unapprove[[:space:]]*$' \
              || [ "${state}" = "CHANGES_REQUESTED" ]; then
              approved=""
            elif printf '%s\n' "${body}" | grep -qE '^[[:space:]]*/approve[[:space:]]*$'; then
              approved="${commit}"
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == env.APPROVER)
                  | [.state, .commit_id, ((.body // "") | @base64)] | @tsv')

          if [ -z "${approved}" ]; then
            verdict failure "Waiting for an /approve review from ${APPROVER}"
            exit 0
          fi

          git fetch --quiet --no-tags origin "${BASE_REF}"
          if ! git cat-file -e "${approved}^{commit}" 2>/dev/null \
            && ! git fetch --quiet --no-tags origin "${approved}"; then
            verdict failure "Approved commit ${approved:0:7} can't be fetched; approve again"
            exit 0
          fi

          change_id() {
            local base
            base=$(git merge-base "origin/${BASE_REF}" "$1")
            git diff -U0 "${base}" "$1" | git patch-id --stable | cut -d' ' -f1
          }
          approved_id=$(change_id "${approved}")
          current_id=$(change_id "${HEAD_SHA}")
          echo "approved ${approved}: ${approved_id:-<empty>}"
          echo "current  ${HEAD_SHA}: ${current_id:-<empty>}"

          if [ -n "${current_id}" ] && [ "${approved_id}" = "${current_id}" ]; then
            verdict success "Approved by ${APPROVER} at ${approved:0:7}; change unchanged"
          else
            verdict failure "Changed since ${APPROVER}'s approval at ${approved:0:7}; approve again"
          fi

      - name: Report the commit status
        if: always()
        env:
          STATE: ${{ steps.evaluate.outputs.state || 'error' }}
          DESCRIPTION: ${{ steps.evaluate.outputs.description || 'Approval check failed to run' }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state="${STATE}" \
            -f context="${CONTEXT}" \
            -f description="${DESCRIPTION:0:140}" \
            -f target_url="${RUN_URL}" > /dev/null
          echo "${CONTEXT}: ${STATE}"
