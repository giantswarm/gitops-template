name: validate light

# Called by validate.yaml, in place of the shared gitops-validate workflow,
# for a pull request that changes nothing validate or the kind test reads (see
# tests/ats/ci_scope.py). Its jobs have the names of gitops-validate's jobs, so
# such a pull request reports the same required checks: check-pre-commit runs
# the pre-commit hooks as gitops-validate does, and validate and test_on_kind
# are skipped, as the change can't alter what they check.

on:
  workflow_call: {}

permissions: {}

jobs:
  check-pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: sudo snap install shfmt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: cache pre-commit environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-gitops-validate-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  validate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Skipped, as the pull request changes nothing this job reads."

  test_on_kind:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Skipped, as the pull request changes nothing this job reads."
