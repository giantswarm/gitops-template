apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
kind: Kustomization
labels:
  - pairs:
      giantswarm.io/managed-by: flux
# The cluster's own values come last in the HelmRelease `valuesFrom`, after its
# region. The cluster appends them with the ../userconfig component, which it
# lists after its region component.
resources:
  - ../../capa
  - cluster_userconfig.yaml
