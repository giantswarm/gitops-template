apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
  - patch: |-
      - op: replace
        path: /spec/name
        value: release-aws
      - op: replace
        path: /spec/version
        value: ${release}
    target:
      group: application.giantswarm.io
      kind: App
resources:
  - ../template
