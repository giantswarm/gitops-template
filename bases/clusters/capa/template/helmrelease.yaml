# A cluster adds its own values by appending a ConfigMap to `valuesFrom` with a
# patch. Later entries win (maps are merged, lists are replaced).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
    # kyverno-policies-ux refuses to delete a resource with this label.
    # Deleting the HelmRelease uninstalls the chart, which deletes the cluster.
    giantswarm.io/prevent-deletion: "true"
  name: ${cluster_name}
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}
    namespace: org-${organization}
  install:
    # Flux remediates a failed install by uninstalling it, which deletes the
    # cluster. Keep a failed install failed instead.
    remediation:
      remediateLastFailure: false
  interval: 5m
  releaseName: ${cluster_name}
  serviceAccountName: automation
  storageNamespace: org-${organization}
  targetNamespace: org-${organization}
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-config
      valuesKey: values
