apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}
  namespace: org-${organization}
spec:
  interval: 10m0s
  provider: generic
  ref:
    # the chart version is the Giant Swarm release
    tag: ${release}
  timeout: 1m0s
  url: oci://gsoci.azurecr.io/charts/giantswarm/release-aws
---
# Helm merges the `valuesFrom` entries in order. Later entries win (maps are
# merged, lists are replaced):
#   1. cluster-app-installation-values: values of the management cluster, such as
#      its name and base domain. Giant Swarm creates it in the `giantswarm`
#      namespace, and a Kyverno policy copies it into every `org-*` namespace.
#   2. ${cluster_name}-config: the values of this base.
#   3. ${cluster_name}-region-config: the values of a region, when the cluster
#      uses one. It is optional, so a cluster without a region works as well.
#   4. A cluster adds its own values by appending a ConfigMap with a patch.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}
    namespace: org-${organization}
  install:
    remediation:
      remediateLastFailure: false
      retries: 10
  interval: 5m0s
  releaseName: ${cluster_name}
  serviceAccountName: automation
  storageNamespace: org-${organization}
  targetNamespace: org-${organization}
  timeout: 10m0s
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: cluster-app-installation-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: ${cluster_name}-config
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-region-config
      optional: true
      valuesKey: values
