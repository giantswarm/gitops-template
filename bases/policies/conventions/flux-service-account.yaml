# Flux Kustomizations and HelmReleases on the management cluster run as the
# `automation` service account, so they can do only what it's allowed to.
# A Kustomization or HelmRelease that applies to a workload cluster through
# its kubeconfig, such as an app's HelmRelease or WC_NAME-direct.yaml, uses
# that cluster's credentials instead.
#
# It checks only what the repository's Flux Kustomizations, which are in the
# `default` namespace, apply: Giant Swarm's own Flux objects are left alone.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: gitops-flux-service-account
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    objectSelector:
      matchLabels:
        kustomize.toolkit.fluxcd.io/namespace: default
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [kustomizations]
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: [v2]
        operations: [CREATE, UPDATE]
        resources: [helmreleases]
  validations:
    - expression: |-
        has(object.spec.kubeConfig) ||
        (has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'automation')
      message: >-
        Set spec.serviceAccountName to automation, unless spec.kubeConfig applies
        it to a workload cluster.
