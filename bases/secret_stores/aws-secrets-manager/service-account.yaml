# The identity ESO uses for Secrets Manager. The IAM role trusts the management cluster's service
# account issuer for this ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-aws-secrets-manager
  annotations:
    # TODO: change to the IAM role that can read your secrets
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/external-secrets-aws-secrets-manager
