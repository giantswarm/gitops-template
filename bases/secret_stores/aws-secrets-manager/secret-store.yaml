# Reads AWS Secrets Manager with IAM roles for service accounts: ESO assumes the IAM role the
# ServiceAccount names, with a token Kubernetes issues for that ServiceAccount, so no access key
# is stored anywhere. See docs/how-to/external-secrets.md for what AWS needs.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1  # TODO: change to the region of your secrets
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-aws-secrets-manager
