# Reads Azure Key Vault with Azure Workload Identity: ESO signs in as the managed identity the
# ServiceAccount names, with a token Kubernetes issues for that ServiceAccount, so no client
# secret is stored anywhere. See docs/guides/workload-cluster-secrets.md for what Azure needs.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://my-key-vault.vault.azure.net  # TODO: change to the URL of your key vault
      serviceAccountRef:
        name: external-secrets-azure-key-vault
