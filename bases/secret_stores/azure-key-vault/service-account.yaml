# The identity ESO uses for the key vault. Federate the managed identity with this
# ServiceAccount, through the management cluster's service account issuer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-azure-key-vault
  annotations:
    # TODO: change to the client ID of the managed identity that can read the key vault
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
    # TODO: change to your Microsoft Entra tenant ID
    azure.workload.identity/tenant-id: 00000000-0000-0000-0000-000000000000
