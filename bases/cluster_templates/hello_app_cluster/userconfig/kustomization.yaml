apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Appends the cluster's own ${cluster_name}-cluster-userconfig ConfigMap to the
# HelmRelease `valuesFrom`, so it comes last and overrides the base and the region.
# A cluster made from the template lists this component last under `components:`.
patches:
  - path: patch_cluster_userconfig.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: \${cluster_name}
