apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
configMapGenerator:
  - behavior: replace
    files:
      - values=cluster_userconfig.yaml
    name: ${cluster_name}-cluster-userconfig
    namespace: org-${organization}
generatorOptions:
  disableNameSuffixHash: true
  # a change to these values reaches the HelmRelease at once, not at its next interval
  labels:
    reconcile.fluxcd.io/watch: Enabled
kind: Kustomization
# (optional) pin the hello-world version and the Giant Swarm release that prod
# runs; the hello-world patch overrides the one in bases/stacks/hello-web.
# Renovate updates these pins in a pull request of their own, on a
# `renovate/prod-*` branch, that isn't automerged. Prod renders the new
# version once this one is merged: merge it after staging has run it.
patches:
  - patch: |-
      - op: replace
        path: /spec/ref/tag
        # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/hello-world versioning=docker
        value: "3.2.2"
    target:
      kind: OCIRepository
      name: \${cluster_name}-hello-world
  # the Giant Swarm release the clusters of this stage run
  - patch: |-
      - op: replace
        path: /spec/ref/tag
        # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/release-aws versioning=docker
        value: "36.1.0"
    target:
      kind: OCIRepository
      name: \${cluster_name}
# block end
resources:
  - ../../../../clusters/hello_app_cluster
