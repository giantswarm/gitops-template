apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
configMapGenerator:
  - behavior: replace
    files:
      - values=cluster_userconfig.yaml
    name: ${cluster_name}-cluster-userconfig
    namespace: org-${organization}
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
# (optional) here we can enforce the app versions that we want in prod. Prod pins
# its own versions here; Renovate proposes each bump in a pull request for review,
# in the same one as the bases it overrides.
patches:
  - patch: |-
      - op: replace
        path: /spec/ref/tag
        # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/hello-world versioning=docker
        value: "3.2.2"
    target:
      kind: OCIRepository
      name: \${cluster_name}-hello-world
  # the Giant Swarm release the clusters of this stage run
  - patch: |-
      - op: replace
        path: /spec/ref/tag
        # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/release-aws versioning=docker
        value: "36.2.0"
    target:
      kind: OCIRepository
      name: \${cluster_name}
# block end
resources:
  - ../../../../cluster_templates/hello_app_cluster
