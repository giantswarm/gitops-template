apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
configMapGenerator:
  - behavior: replace
    files:
      - values=cluster_userconfig.yaml
    name: ${cluster_name}-cluster-userconfig
    namespace: org-${organization}
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
# (optional) pin the hello-world version and the Giant Swarm release that prod
# runs. Renovate updates prod's pins in a pull request of its own (a
# `renovate/prod-*` branch), apart from the one for the bases, dev and staging.
# Merge it after staging has run the new version.
patches:
  - patch: |-
      - op: replace
        path: /spec/ref/tag
        # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/hello-world versioning=docker
        value: "3.2.2"
    target:
      kind: OCIRepository
      name: \${cluster_name}-hello-world
  # the Giant Swarm release the clusters of this stage run
  - patch: |-
      - op: replace
        path: /spec/ref/tag
        # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/release-aws versioning=docker
        value: "36.2.0"
    target:
      kind: OCIRepository
      name: \${cluster_name}
# block end
resources:
  - ../../../../cluster_templates/hello_app_cluster
