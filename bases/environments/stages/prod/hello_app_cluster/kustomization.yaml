apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
configMapGenerator:
  - behavior: replace
    files:
      - values=cluster_userconfig.yaml
    name: ${cluster_name}-cluster-userconfig
    namespace: org-${organization}
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
# (optional) pin the hello-world version and the Giant Swarm release that prod
# runs; the hello-world patch overrides the app set's. Renovate updates these
# pins in a pull request of their own, on a `renovate/prod-*` branch. The other
# pull request for the same update changes what the out-of-band clusters render
# for hello-world (dev and staging follow a semver range instead), and what the
# WC_NAME* clusters, dev and staging render for the release. Prod renders the
# new version once this one is merged: merge it after staging has run it.
patches:
  - patch: |-
      - op: replace
        path: /spec/ref/tag
        # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/hello-world versioning=docker
        value: "3.2.2"
    target:
      kind: OCIRepository
      name: \${cluster_name}-hello-world
  # the Giant Swarm release the clusters of this stage run
  - patch: |-
      - op: replace
        path: /spec/ref/tag
        # renovate: datasource=docker depName=gsoci.azurecr.io/charts/giantswarm/release-aws versioning=docker
        value: "36.2.0"
    target:
      kind: OCIRepository
      name: \${cluster_name}
# block end
resources:
  - ../../../../cluster_templates/hello_app_cluster
