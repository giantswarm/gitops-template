apiVersion: kustomize.config.k8s.io/v1beta1
buildMetadata: [originAnnotations]
# the Giant Swarm release the clusters of this stage run, see cluster_user_config.yaml
configMapGenerator:
  - behavior: replace
    files:
      - values=cluster_user_config.yaml
    name: ${cluster_name}-user-config
    namespace: org-${organization}
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
# (optional) here we can enforce the app versions that we want in this stage.
# The dev stage follows the highest dev build of hello-world: `semver` with the
# `-0` suffix makes pre-releases eligible, `semverFilter` keeps only dev builds
# (`X.Y.Z-r<branch-CRC32>t<timestamp>h<sha>`). Builds of the same version are
# ordered by branch hash before timestamp, so to follow one branch put its
# CRC32 into the filter instead of `[0-9a-f]{8}`.
patches:
  - patch: |-
      - op: replace
        path: /spec/ref
        value:
          semver: '>=3.0.0-0'
          semverFilter: '-r[0-9a-f]{8}t[0-9]{14}h[0-9a-f]{7}'
    target:
      kind: OCIRepository
      name: \${cluster_name}-hello-world
  # the cluster chart version the release ships
  - patch: |-
      - op: replace
        path: /spec/version
        value: "11.0.1"
    target:
      kind: App
      name: \${cluster_name}
# block end
resources:
  - ../../../../cluster_templates/hello_app_cluster
