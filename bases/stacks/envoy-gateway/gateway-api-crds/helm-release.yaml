apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-gateway-api-crds
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-gateway-api-crds
    namespace: org-${organization}
  install:
    remediation:
      remediateLastFailure: false
      # retry until it succeeds, as the cluster chart does for its default apps
      retries: -1
  interval: 5m
  kubeConfig:
    secretRef:
      name: ${cluster_name}-kubeconfig
  releaseName: gateway-api-crds
  storageNamespace: kube-system
  targetNamespace: kube-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-crds-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-crds-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-gateway-api-crds-user-secrets
      optional: true
      valuesKey: values
