apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-gateway-api-config
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-gateway-api-config
    namespace: org-${organization}
  dependsOn:
    - name: ${cluster_name}-envoy-gateway
  install:
    remediation:
      remediateLastFailure: false
      # retry until it succeeds, as the cluster chart does for its default apps:
      # this chart renders Kyverno, cert-manager or monitoring resources, whose
      # CRDs a new cluster only gets once its default apps are installed
      retries: -1
  interval: 5m
  kubeConfig:
    secretRef:
      name: ${cluster_name}-kubeconfig
  releaseName: gateway-api-config
  storageNamespace: envoy-gateway-system
  targetNamespace: envoy-gateway-system
  timeout: 10m
  uninstall:
    # helm-controller ignores dependsOn on delete, so a pruned stack's releases are
    # uninstalled at once; if envoy-gateway goes first, the GatewayClass keeps its
    # finalizer and a waiting uninstall would fail after the timeout
    disableWait: true
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-config-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-config-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-gateway-api-config-user-secrets
      optional: true
      valuesKey: values
