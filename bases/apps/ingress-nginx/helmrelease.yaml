apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${cluster_name}-ingress-nginx
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-ingress-nginx
  install:
    createNamespace: true
  interval: 10m
  # the workload cluster this release is installed into; drop this block to
  # install into the cluster Flux itself runs in
  kubeConfig:
    secretRef:
      name: ${cluster_name}-kubeconfig
  releaseName: ${cluster_name}-ingress-nginx
  storageNamespace: kube-system
  targetNamespace: kube-system
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-ingress-nginx-values
      valuesKey: values
