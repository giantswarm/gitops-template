# Envoy Gateway is installed as three charts, in this order:
#   gateway-api-crds   -> the Gateway API CRDs (Gateway, HTTPRoute, ...)
#   envoy-gateway      -> the Envoy Gateway controller
#   gateway-api-config -> the `giantswarm-default` GatewayClass and Gateway
# The HelmReleases run on the management cluster and install into the workload
# cluster through its kubeconfig secret. The fields follow what
# giantswarm/appcr-to-helmrelease-converter emits for a migrated App CR, except
# install retries (see below) and `createNamespace`.
#
# Values are merged in `valuesFrom` order, later entries win (maps are merged,
# lists are replaced):
#   1. ${cluster_name}-cluster-values        cluster values (baseDomain, provider, ...),
#                                            created for every workload cluster
#   2. ${cluster_name}-<chart>-values        this App Template's defaults
#   3. ${cluster_name}-<chart>-user-values   (optional) overrides, like an App CR's userConfig
#   4. ${cluster_name}-<chart>-user-secrets  (optional) the same, as an encrypted Secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-gateway-api-crds
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-gateway-api-crds
    namespace: org-${organization}
  install:
    remediation:
      remediateLastFailure: false
      # retry until it succeeds, as the cluster chart does for its default apps
      retries: -1
  interval: 5m
  kubeConfig:
    secretRef:
      name: ${cluster_name}-kubeconfig
  releaseName: gateway-api-crds
  storageNamespace: kube-system
  targetNamespace: kube-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-crds-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-crds-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-gateway-api-crds-user-secrets
      optional: true
      valuesKey: values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-envoy-gateway
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-envoy-gateway
    namespace: org-${organization}
  dependsOn:
    - name: ${cluster_name}-gateway-api-crds
  install:
    # envoy-gateway-system does not exist yet; gateway-api-config installs into it
    # after this release (dependsOn)
    createNamespace: true
    remediation:
      remediateLastFailure: false
      # retry until it succeeds, as the cluster chart does for its default apps:
      # this chart renders Kyverno, cert-manager or monitoring resources, whose
      # CRDs a new cluster only gets once its default apps are installed
      retries: -1
  interval: 5m
  kubeConfig:
    secretRef:
      name: ${cluster_name}-kubeconfig
  releaseName: envoy-gateway
  storageNamespace: envoy-gateway-system
  targetNamespace: envoy-gateway-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-envoy-gateway-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-envoy-gateway-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-envoy-gateway-user-secrets
      optional: true
      valuesKey: values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-gateway-api-config
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-gateway-api-config
    namespace: org-${organization}
  dependsOn:
    - name: ${cluster_name}-envoy-gateway
  install:
    remediation:
      remediateLastFailure: false
      # retry until it succeeds, as the cluster chart does for its default apps:
      # this chart renders Kyverno, cert-manager or monitoring resources, whose
      # CRDs a new cluster only gets once its default apps are installed
      retries: -1
  interval: 5m
  kubeConfig:
    secretRef:
      name: ${cluster_name}-kubeconfig
  releaseName: gateway-api-config
  storageNamespace: envoy-gateway-system
  targetNamespace: envoy-gateway-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 10
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-config-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-config-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-gateway-api-config-user-secrets
      optional: true
      valuesKey: values
