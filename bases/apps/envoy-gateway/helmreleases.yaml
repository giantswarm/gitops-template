# Envoy Gateway is installed as three charts, in this order:
#   gateway-api-crds   -> the Gateway API CRDs (Gateway, HTTPRoute, ...)
#   envoy-gateway      -> the Envoy Gateway controller
#   gateway-api-config -> the `giantswarm-default` GatewayClass and Gateway
# The HelmReleases run on the management cluster and install into the workload
# cluster through its kubeconfig secret.
#
# Values are merged in `valuesFrom` order, later entries win (maps are merged,
# lists are replaced):
#   1. ${cluster_name}-cluster-values           cluster values (baseDomain, provider, ...),
#                                               created for every workload cluster
#   2. ${cluster_name}-<chart>-values           this App Template's defaults
#   3. ${cluster_name}-<chart>-template-values  (optional) cluster template overrides
#   4. ${cluster_name}-<chart>-user-values      (optional) overrides for one cluster
#   5. ${cluster_name}-<chart>-user-secrets     (optional) the same, as an encrypted Secret
#
# A fresh cluster can take longer than one attempt to get the Gateway's load
# balancer, DNS record and certificate ready, so installs and upgrades retry
# until they succeed instead of staying failed.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-gateway-api-crds
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-gateway-api-crds
  install:
    remediation:
      retries: -1
  interval: 10m
  kubeConfig:
    secretRef:
      key: value
      name: ${cluster_name}-kubeconfig
  releaseName: gateway-api-crds
  storageNamespace: kube-system
  targetNamespace: kube-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: false
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-crds-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-crds-template-values
      optional: true
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-crds-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-gateway-api-crds-user-secrets
      optional: true
      valuesKey: values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-envoy-gateway
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-envoy-gateway
  dependsOn:
    - name: ${cluster_name}-gateway-api-crds
  install:
    createNamespace: true
    remediation:
      retries: -1
  interval: 10m
  kubeConfig:
    secretRef:
      key: value
      name: ${cluster_name}-kubeconfig
  releaseName: envoy-gateway
  storageNamespace: envoy-gateway-system
  targetNamespace: envoy-gateway-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: false
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-envoy-gateway-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-envoy-gateway-template-values
      optional: true
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-envoy-gateway-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-envoy-gateway-user-secrets
      optional: true
      valuesKey: values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-gateway-api-config
  namespace: org-${organization}
spec:
  chartRef:
    kind: OCIRepository
    name: ${cluster_name}-gateway-api-config
  dependsOn:
    - name: ${cluster_name}-envoy-gateway
  install:
    remediation:
      retries: -1
  interval: 10m
  kubeConfig:
    secretRef:
      key: value
      name: ${cluster_name}-kubeconfig
  releaseName: gateway-api-config
  storageNamespace: envoy-gateway-system
  targetNamespace: envoy-gateway-system
  timeout: 10m
  upgrade:
    remediation:
      remediateLastFailure: false
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: ${cluster_name}-cluster-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-config-values
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-config-template-values
      optional: true
      valuesKey: values
    - kind: ConfigMap
      name: ${cluster_name}-gateway-api-config-user-values
      optional: true
      valuesKey: values
    - kind: Secret
      name: ${cluster_name}-gateway-api-config-user-secrets
      optional: true
      valuesKey: values
