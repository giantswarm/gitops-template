# One OCIRepository per chart. `ref.semver` picks the newest published version in
# the range, so patch releases roll out without a commit here. Widen or pin the
# range to control that; a cluster template can pin a stage by patching
# `spec.ref` of the OCIRepository.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-gateway-api-crds
  namespace: org-${organization}
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ~1.9.1
  url: oci://gsoci.azurecr.io/charts/giantswarm/gateway-api-crds
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-envoy-gateway
  namespace: org-${organization}
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ~1.10.3
  url: oci://gsoci.azurecr.io/charts/giantswarm/envoy-gateway
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    giantswarm.io/cluster: ${cluster_name}
  name: ${cluster_name}-gateway-api-config
  namespace: org-${organization}
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ~1.11.3
  url: oci://gsoci.azurecr.io/charts/giantswarm/gateway-api-config
