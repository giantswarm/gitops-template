# Fixture for tools/test-all-ff: a Kustomization of this repository whose path is mistyped. Its
# source is the repository's, so tools/test-all-ff has to build it, and fail.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mistyped-path
  namespace: default
spec:
  interval: 1m
  path: ./roots
  prune: true
  sourceRef:
    kind: GitRepository
    name: your-repo
