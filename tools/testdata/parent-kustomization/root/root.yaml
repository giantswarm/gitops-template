# Fixture for tools/test-all-ff: the root Kustomization, which applies the directory its file is
# in, as a management cluster's does. Its source is the repository's GitRepository.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: parent-root
  namespace: default
spec:
  interval: 1m
  path: ./root
  prune: false
  sourceRef:
    kind: GitRepository
    name: parent-kustomization
