# No namespace: its parent's `targetNamespace` sets it. `${organization}` is the parent's.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: parent-direct
spec:
  interval: 1m
  path: ./root/organization/direct
  postBuild:
    substitute:
      cluster_name: "parent-direct"
      organization: "${organization}"
  prune: false
  sourceRef:
    kind: GitRepository
    name: parent-kustomization
    namespace: default
