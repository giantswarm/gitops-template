# A cluster that is still a cluster-aws App CR, as in a fork with clusters older than
# release v34. Its App reads the cluster's userconfig ConfigMap, so the userconfig check of
# tools/validate-helm-values passes.
apiVersion: v1
data:
  values: |
    global:
      nodePools:
        workers:
          instanceType: m6i.xlarge
kind: ConfigMap
metadata:
  name: demo-cluster-userconfig
  namespace: org-demo
---
apiVersion: application.giantswarm.io/v1alpha1
kind: App
metadata:
  name: demo
  namespace: org-demo
spec:
  catalog: cluster
  name: cluster-aws
  namespace: org-demo
  userConfig:
    configMap:
      name: demo-cluster-userconfig
      namespace: org-demo
  version: 2.6.0
