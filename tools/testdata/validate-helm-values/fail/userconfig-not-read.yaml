# A cluster's userconfig ConfigMap that nothing reads, as when a cluster made from a cluster
# template leaves out the template's userconfig component. The userconfig check of
# tools/validate-helm-values fails.
apiVersion: v1
data:
  values: |
    global:
      nodePools:
        workers:
          instanceType: m6i.xlarge
kind: ConfigMap
metadata:
  name: demo-cluster-userconfig
  namespace: org-demo
