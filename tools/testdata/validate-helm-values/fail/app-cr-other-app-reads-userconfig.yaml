# Only the cluster's own App counts as reading the cluster's userconfig ConfigMap. Here an
# app of the cluster names it by mistake, and nothing installs the cluster with it, so the
# userconfig check of tools/validate-helm-values fails.
apiVersion: v1
data:
  values: |
    global:
      nodePools:
        workers:
          instanceType: m6i.xlarge
kind: ConfigMap
metadata:
  name: demo-cluster-userconfig
  namespace: org-demo
---
apiVersion: application.giantswarm.io/v1alpha1
kind: App
metadata:
  name: demo-hello-world
  namespace: org-demo
spec:
  catalog: giantswarm
  name: hello-world
  namespace: hello-world
  userConfig:
    configMap:
      name: demo-cluster-userconfig
      namespace: org-demo
  version: 3.2.2
