# The same name as cluster.yaml's, in the placeholder namespace that ../kustomization.yaml completes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ancestor-replacement
  namespace: org-ORG_NAME
spec:
  interval: 1m
  path: ./organization/clusters/direct
  postBuild:
    substitute:
      cluster_name: "ancestor-replacement-direct"
      organization: "ORG_NAME"
  prune: false
  sourceRef:
    kind: GitRepository
    name: ancestor-replacement
    namespace: default
