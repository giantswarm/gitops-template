# A values ConfigMap without the reconcile.fluxcd.io/watch: Enabled label, which helm-controller
# needs to reconcile the HelmRelease when the values change. tools/test-all-ff checks that
# tools/validate-helm-values reports it.
apiVersion: v1
data:
  values: |
    global:
      metadata:
        name: no-watch-label
        organization: demo
      providerSpecific:
        region: eu-central-1
kind: ConfigMap
metadata:
  name: no-watch-label-config
  namespace: org-demo
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: no-watch-label
  namespace: org-demo
spec:
  interval: 10m0s
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 36.2.1
  url: oci://gsoci.azurecr.io/charts/giantswarm/release-aws
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: no-watch-label
  namespace: org-demo
spec:
  chartRef:
    kind: OCIRepository
    name: no-watch-label
    namespace: org-demo
  interval: 5m0s
  valuesFrom:
    - kind: ConfigMap
      name: cluster-app-installation-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: no-watch-label-config
      valuesKey: values
