# The fixture's management cluster Kustomization: it applies its own directory, so its
# GitRepository is the repository's.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: root
  namespace: default
spec:
  interval: 1m
  path: ./root
  prune: true
  sourceRef:
    kind: GitRepository
    name: your-repo
