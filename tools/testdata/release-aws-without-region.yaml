# A release-aws cluster without a region, as when a cluster's kustomization leaves out its
# region component. tools/test-all-ff checks that tools/validate-helm-values reports it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: no-region
  namespace: org-demo
spec:
  interval: 10m0s
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 36.2.0
  url: oci://gsoci.azurecr.io/charts/giantswarm/release-aws
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: no-region
  namespace: org-demo
spec:
  chartRef:
    kind: OCIRepository
    name: no-region
    namespace: org-demo
  interval: 5m0s
  valuesFrom:
    - kind: ConfigMap
      name: cluster-app-installation-values
      valuesKey: values.yaml
