minimum_pre_commit_version: 2.17.0
repos:

    - repo: meta
      hooks:
          - id: check-useless-excludes

    # format Python code with black
    - repo: https://github.com/psf/black
      rev: 26.10.1
      hooks:
          - id: black
            language_version: python3
            files: ^tests/ats/.*\.py$

    # accept proper type annotations only
    - repo: https://github.com/pre-commit/pygrep-hooks
      rev: v1.10.0  # Use the ref you want to point at
      hooks:
          - id: python-use-type-annotations
          - id: python-check-blanket-noqa
    # bandit
    - repo: https://github.com/PyCQA/bandit
      rev: '1.9.4'
      hooks:
          - id: bandit
            args: ["-c", ".bandit"]

    # static type checking with mypy
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.4.1
      hooks:
          - id: mypy

    - repo: https://github.com/pycqa/flake8
      rev: '7.5.0'  # pick a git hash / tag to point to
      hooks:
          - id: flake8

    # shell scripts
    - repo: https://github.com/detailyang/pre-commit-shell
      rev: v1.0.6
      hooks:
          - id: shell-lint
            args: [--format=json]

    - repo: https://github.com/igorshubovych/markdownlint-cli
      rev: v0.50.0
      hooks:
          - id: markdownlint

    # every Flux Kustomization's path exists and builds, see docs/reference/ci-checks.md
    - repo: local
      hooks:
          - id: check-kustomization-paths
            name: Flux Kustomization paths exist and build
            entry: tools/check-kustomization-paths
            language: script
            pass_filenames: false
            always_run: true
          # every directory in bases/ and management-clusters/ has a README, see tools/README.md
          - id: check-directory-readmes
            name: Directories explain themselves with a README
            entry: tools/check-directory-readmes
            language: script
            pass_filenames: false
            always_run: true

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-docstring-first
          - id: debug-statements
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-ast
          - id: check-builtin-literals
          - id: detect-private-key
          - id: mixed-line-ending

    - repo: https://github.com/adrienverge/yamllint
      rev: v1.38.0
      hooks:
          - id: yamllint

    - repo: https://github.com/syntaqx/git-hooks
      rev: v0.0.18
      hooks:
          - id: shellcheck
          - id: shfmt
            args:
                - "-w"
